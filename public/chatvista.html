<!DOCTYPE html>
<html lang="pt-BR">     
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Chat Vista Alegre
        </title>
        <style>
            h1{
                text-align: center;
                font-family:"Brush Script MT", cursive;
                color: black;
            }

            p{
                text-align: center;
                font-family: Georgia, 'Times New Roman', Times, serif;
                color: black;
            }

            body {  
                font-family: Arial, sans-serif;
                background: url('https://img.freepik.com/premium-vector/playful-favela-doodle-vector-art-illustration-with-bold-colors-graffiti-white-background_992796-629.jpg?w=2000') no-repeat center center fixed;
                background-size: cover;
                margin: 0;
                min-height: 100vh;
            }

            .container {
                width: min(320px, calc(100% - 32px));
                margin: 40px auto 0 auto;
                padding: 20px;
                background-color: rgba(255,255,255,0.93);
                border: 1px solid #ccc;
                border-radius: 14px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.10);
                position: relative;
                z-index: 2;
            }   

            button[type="submit"] {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: #fff;
                border: none;
                border-radius: 6px;
                font-size: 1em;
                cursor: pointer;
                transition: background 0.2s;
            }   

            button[type="submit"]:hover {
                background-color: #ffc107;
                color: #222;
            }

            button[type="submit"]:focus-visible {
                outline: 2px solid #111;
                outline-offset: 2px;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <h1>Chat Vista Alegre</h1>
            <p>Entre na sala e converse com a comunidade.</p>
            <form id="loginForm">
                <button type="submit" aria-label="Entrar na sala de bate-papo">Entrar</button>
            </form>
        </div>

        <script>
            document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();
                window.location.href = "SALA.html";
            });
        </script>
    </body>
</html>
