<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Bate-Papo</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --mobile-control-height: 44px;
      --bg: rgba(255,255,255,0.96);
      --surface: rgba(248,250,252,0.94);
      --text: #0f172a;
      --muted: #475569;
      --border: #d1d5db;
      --primary: #2563eb;
      --secondary: #60a5fa;
      --danger: #b91c1c;
      --shadow: 0 6px 24px rgba(15, 23, 42, 0.16);
      --message-bg: #ffffff;
      --message-alt-bg: #f8fafc;
    }

    body {
      font-family: Arial, sans-serif;
      background: url('https://img.freepik.com/premium-vector/playful-favela-doodle-vector-art-illustration-with-bold-colors-graffiti-white-background_992796-629.jpg?w=2000') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      box-sizing: border-box;
      color: var(--text);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.dark-theme {
      color: #e2e8f0;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.98)), url('https://img.freepik.com/premium-vector/playful-favela-doodle-vector-art-illustration-with-bold-colors-graffiti-white-background_992796-629.jpg?w=2000') no-repeat center center fixed;
      background-size: cover;
    }
    .chat-container {
      width: min(560px, calc(100% - 24px));
      margin: clamp(10px, 3vw, 40px) auto;
      background: rgba(255,255,255,0.96);
      border: 1px solid #d1d5db;
      box-sizing: border-box;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.16);
      padding: clamp(10px, 2vw, 20px);
      display: flex;
      flex-direction: column;
      height: min(85dvh, 820px);
      min-height: 520px;
    }

    @media (min-width: 1200px) {
      .chat-container {
        width: min(600px, calc(100% - 56px));
        margin: 28px auto;
      }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      margin-bottom: 12px;
      background: var(--message-alt-bg);
      font-size: clamp(0.93rem, 1.6vw, 1.05rem);
      line-height: 1.4;
      position: relative;
      scroll-behavior: smooth;
    }

    .chat-header,
    .online-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .chat-header {
      flex-wrap: wrap;
    }

    .status-panel,
    .online-stats {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-panel {
      font-size: 0.92rem;
      color: var(--muted);
    }

    .connection-status {
      font-weight: 700;
      color: var(--muted);
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .connection-status.status-error {
      color: var(--danger);
      border-color: rgba(185,28,28,0.28);
      background: rgba(248,113,113,0.12);
    }

    .theme-toggle-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .theme-toggle-btn:hover {
      transform: translateY(-1px);
      background: var(--primary);
      color: #fff;
    }

    .online-panel {
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .online-panel strong {
      font-size: 0.95rem;
      color: var(--text);
    }

    .online-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .online-chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
    }

    .online-chip:hover {
      transform: translateY(-1px);
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    .online-chip .user-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      flex-shrink: 0;
    }

    .pinned-banner {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff9e6;
      color: #92400e;
      font-size: 0.95rem;
    }

    .message.mine {
      background: rgba(37, 99, 235, 0.08);
      border-left: 3px solid var(--primary);
    }

    .message.mine .msg-text {
      color: #0f172a;
    }

    .message {
      margin-bottom: 2px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 4px;
      animation: msgIn 0.18s ease;
      transition: background 0.15s;
    }
    .message:hover {
      background: rgba(15, 23, 42, 0.05);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message span.username {
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .message span.username:hover {
      opacity: 0.75;
    }
    .msg-text {
      color: #0f172a;
      word-break: break-word;
      flex: 1;
    }
    .avatar-badge {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 24px;
      background: #e2e8f0;
      border: none;
      font-size: 0.75em;
      line-height: 1;
      color: #0f172a;
      vertical-align: middle;
    }
    .avatar-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .username-label {
      display: inline-block;
    }
    .audio-message {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
      padding: 4px 8px;
      border-radius: 4px;
      animation: msgIn 0.18s ease;
    }
    .new-messages-btn {
      position: sticky;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      animation: popIn 0.18s ease;
      width: fit-content;
      margin: 4px auto 0;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateX(-50%) scale(0.85); }
      to   { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    .input-area {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) auto;
      gap: 10px;
      align-items: end;
    }
    .char-counter {
      color: var(--muted);
      font-size: 0.82rem;
      grid-column: 1 / -1;
      text-align: right;
    }
    .input-area textarea,
    .input-area input[type="text"] {
      flex: 1;
      min-width: 110px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.96rem;
      resize: none;
    }
    .input-area button.clear-profile-btn {
      background: #e2e8f0;
      color: #0f172a;
      min-width: 118px;
      font-weight: 700;
    }
    .input-area button.clear-profile-btn:hover {
      background: #cbd5e1;
      color: #111;
    }
    .input-area #username {
      flex: 0 0 120px;
      max-width: 120px;
    }
    .input-area #messageInput {
      flex: 1 1 260px;
      min-width: 180px;
      min-height: 60px;
      max-height: 120px;
      padding: 10px;
      line-height: 1.3;
      box-sizing: border-box;
      align-self: stretch;
      font-family: inherit;
    }
    .message-help {
      font-size: 0.82rem;
      color: #475569;
      width: 100%;
      margin-top: -4px;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: #475569;
      margin-left: 12px;
    }
    .connection-status.status-error {
      color: #b91c1c;
    }
    .input-area input[type="file"] {
      display: none;
    }
    .avatar-preview {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .avatar-preview .avatar-badge {
      width: 100%;
      height: 100%;
      flex: 0 0 100%;
      border: 0;
    }
    .avatar-preview:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }
    .avatar-preview:focus-visible {
      outline: 2px solid #111;
      outline-offset: 2px;
    }
    .avatar-preview[aria-disabled="true"] {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .input-area button {
      padding: 9px 12px;
      border-radius: 7px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s;
      min-height: 40px;
    }
    .input-area button[type="submit"],
    #audioBtn,
    #fileBtn {
      min-width: 92px;
    }
    .input-area button:hover {
      background: #60a5fa;
      color: #222;
    }
    .input-area select,
    .input-area input[type="color"] {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      margin-right: 4px;
      min-width: 48px;
      min-height: 44px;
    }
    .recording {
      color: #d32f2f;
      font-weight: bold;
      margin-left: 8px;
      animation: blink 1s steps(2, start) infinite;
    }
    .file-message {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .file-message a {
      color: #2563eb;
      text-decoration: underline;
      word-break: break-all;
      font-weight: 600;
    }
    .file-message img {
      max-width: 160px;
      max-height: 160px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
    }
    .message-time {
      display: inline-block;
      margin-left: 4px;
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .audio-message .message-time {
      margin-left: auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes blink {
      to {
        visibility: hidden;
      }
    }
    @media (max-width: 900px) {
      body {
        background-attachment: scroll;
      }

      .chat-container {
        width: calc(100% - 12px);
        height: calc(100dvh - 12px);
        min-height: 0;
        margin: 8px auto;
        padding: 12px;
      }

      .input-area {
        display: grid;
        grid-template-columns: 38px 44px 1fr 1fr;
        gap: 6px;
      }

      #username {
        grid-column: 3 / 5;
        max-width: none;
      }

      #messageInput {
        grid-column: 1 / -1;
      }

      .input-area button {
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        font-size: 0.93rem;
      }

      .input-area select,
      .input-area input[type="color"] {
        min-height: 44px;
        min-width: 44px;
        padding: 6px;
      }

      .input-area button[type="submit"] {
        grid-column: 1 / 3;
      }

      #audioBtn {
        grid-column: 3 / 5;
      }

      #recordingStatus {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 600px) {
      .chat-container {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        margin: 0;
        border-radius: 0;
        padding: 10px 10px calc(12px + env(safe-area-inset-bottom));
      }

      #online-users {
        font-size: 0.95rem;
        margin-bottom: 8px;
      }

      .messages {
        margin-bottom: 10px;
        padding: 10px 8px;
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .input-area {
        grid-template-columns: 44px 52px 1fr;
        gap: 8px;
        align-items: center;
      }

      #username {
        grid-column: 3 / 4;
      }

      #messageInput {
        grid-column: 1 / -1;
      }

      #messageCounter {
        grid-column: 1 / -1;
        justify-self: end;
      }

      .input-area input[type="text"] {
        min-width: 0;
        padding: 10px;
        font-size: 0.95rem;
      }

      .input-area button {
        width: 100%;
        min-height: var(--mobile-control-height);
        height: var(--mobile-control-height);
        padding: 8px 8px;
        font-size: 0.84rem;
      }

      .input-area select,
      .input-area input[type="color"] {
        min-height: var(--mobile-control-height);
        height: var(--mobile-control-height);
        min-width: 52px;
        width: auto;
        padding: 6px;
      }

      #colorPicker {
        width: 52px;
        min-width: 52px;
        max-width: 52px;
        justify-self: start;
      }

      #fileBtn {
        grid-column: 1 / 2;
      }

      #audioBtn {
        grid-column: 2 / 3;
      }

      .input-area button[type="submit"] {
        grid-column: 3 / 4;
      }

      #recordingStatus {
        grid-column: 1 / -1;
      }

      .avatar-preview {
        width: 44px;
        height: 44px;
      }
    }

    @media (min-width: 421px) and (max-width: 600px) {
      .input-area button {
        min-height: var(--mobile-control-height);
        height: var(--mobile-control-height);
      }
    }

    @media (max-width: 420px) {
      .input-area {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      #username {
        grid-column: 1 / -1;
      }

      #username,
      #messageInput,
      #recordingStatus {
        grid-column: 1 / -1;
      }

      #messageCounter {
        grid-column: 1 / -1;
      }

      #fileBtn {
        grid-column: 1 / 2;
      }

      #audioBtn {
        grid-column: 2 / 3;
      }

      .input-area button[type="submit"] {
        grid-column: 1 / -1;
      }

      .input-area button {
        width: 100%;
        min-height: var(--mobile-control-height);
        height: var(--mobile-control-height);
      }

      .avatar-preview {
        width: 42px;
        height: 42px;
      }

      .input-area button {
        padding: 8px 10px;
        font-size: 0.84rem;
      }

      #colorPicker {
        width: 52px;
        min-width: 52px;
        max-width: 52px;
        justify-self: start;
      }
    }
    .private-chat {
      position: fixed;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(370px, calc(100vw - 24px));
      background: rgba(255,255,255,0.98);
      border: 2px solid #2563eb;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      height: min(440px, 68dvh);
      animation: fadeInUp 0.3s;
      transition: height 0.2s, width 0.2s, bottom 0.2s;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      border-top: 6px solid #2563eb;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(80px);} 
      to { opacity: 1; transform: translateY(0);} 
    }
    .private-header {
      background: linear-gradient(90deg, #2563eb 60%, #60a5fa 100%);
      color: #fff;
      padding: 14px 20px;
      border-radius: 18px 18px 0 0;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      letter-spacing: 0.5px;
      font-size: 1.13em;
    }
    .private-header.private-unread {
      background: linear-gradient(90deg, #b45309 50%, #f59e0b 100%);
      animation: privateHeaderPulse 1s ease-in-out infinite;
    }
    @keyframes privateHeaderPulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.42); }
      70% { box-shadow: 0 0 0 9px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .private-header .header-btns { display: flex; gap: 8px; }
    .private-header button {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      font-size: 1.3em;
      cursor: pointer;
      padding: 0 6px;
      height: 32px;
      width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .private-header button:hover { background: #1746a0; }
    .private-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f6f8fa;
      font-size: 1.08em;
      transition: height 0.2s;
      border-radius: 0 0 12px 12px;
      margin-bottom: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04) inset;
    }
    .private-input-area {
      display: flex;
      gap: 8px;
      padding: 12px 10px;
      border-top: 1px solid #eee;
      background: #fafdff;
      transition: height 0.2s;
      align-items: center;
      flex-wrap: wrap;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.03) inset;
    }
    .private-input-area input[type="text"] {
      flex: 1 1 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #b3c6e0;
      font-size: 1.08em;
      min-width: 0;
      background: #f7faff;
      transition: border 0.2s;
    }
    .private-input-area input[type="text"]:focus {
      border: 1.5px solid #2563eb;
      outline: none;
      background: #fff;
    }
    .private-input-area label {
      display: flex;
      align-items: center;
      cursor: pointer;
      margin: 0 2px;
      border-radius: 6px;
      transition: background 0.2s;
      padding: 2px 4px;
    }
    .private-input-area label:hover { background: #e3e8f7; }
    .private-input-area label span {
      font-size: 1.5em;
      padding: 0 4px;
      line-height: 1;
      color: #2563eb;
      transition: color 0.2s;
    }
    .private-input-area label:hover span { color: #1746a0; }
    .private-input-area input[type="file"] { display: none; }
    .private-input-area button[type="submit"] {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.2s;
      margin-left: 2px;
      height: 40px;
      display: flex;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .private-input-area button[type="submit"]:hover {
      background: #60a5fa;
      color: #222;
    }
    .private-file-message {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .private-file-message a {
      color: #2563eb;
      text-decoration: underline;
      word-break: break-all;
    }
    .private-file-message img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .private-msg {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: #eaf1ff;
      color: #0f172a;
      max-width: 85%;
      word-break: break-word;
    }
    .private-msg.mine {
      margin-left: auto;
      background: #2563eb;
      color: #fff;
    }
    .private-msg.system {
      margin-left: auto;
      margin-right: auto;
      background: #eef2ff;
      color: #334155;
      text-align: center;
      font-size: 0.95em;
    }
    .private-msg-time {
      display: block;
      margin-top: 4px;

    function isSupabaseConfigured() {
      return (
        typeof supabaseConfig.url === 'string' &&
        typeof supabaseConfig.anonKey === 'string' &&
        !supabaseConfig.url.startsWith('COLE_') &&
        !supabaseConfig.anonKey.startsWith('COLE_')
      );
    }

    function getOrCreateClientId() {
      const sessionKey = 'chatvista.clientId.session';
      const baseKey = 'chatvista.clientId.base';

      const savedSession = window.sessionStorage.getItem(sessionKey);
      if (savedSession) return savedSession;

      const savedLegacy = window.localStorage.getItem('chatvista.clientId');
      const savedBase = window.localStorage.getItem(baseKey);
      const base = savedBase || savedLegacy || `user-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      window.localStorage.setItem(baseKey, base);

      const sessionSuffix = typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(16).slice(2);

      const sessionClientId = `${base}:${sessionSuffix}`;
      window.sessionStorage.setItem(sessionKey, sessionClientId);
      return sessionClientId;
    }

    async function authenticateSupabaseUser() {
      if (!supabase) throw new Error('Cliente Supabase não inicializado');

      const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
      if (sessionError) {
        throw sessionError;
      }

      const existingUser = sessionData && sessionData.session && sessionData.session.user;
      if (existingUser && existingUser.id) {
        return {
          uid: existingUser.id,
          isAnonymous: Boolean(existingUser.is_anonymous)
        };
      }

      const { data: signInData, error: signInError } = await supabase.auth.signInAnonymously();
      if (signInError) {
        throw signInError;
      }

      const signedUser = (signInData && signInData.user)
        || (signInData && signInData.session && signInData.session.user);

      if (!signedUser || !signedUser.id) {
        throw new Error('Falha ao autenticar usuário anônimo no Supabase');
      }

      return {
        uid: signedUser.id,
        isAnonymous: Boolean(signedUser.is_anonymous)
      };
    }

    function bindAuthStateListener() {
      if (!supabase || authSubscription) return;

      const binding = supabase.auth.onAuthStateChange(function (_event, session) {
        const sessionUser = session && session.user;
        if (sessionUser && sessionUser.id) {
          currentUser = {
            uid: sessionUser.id,
            isAnonymous: Boolean(sessionUser.is_anonymous)
          };
          return;
        }

        currentUser = null;
      });

      authSubscription = binding && binding.data && binding.data.subscription
        ? binding.data.subscription
        : null;
    }

    function saveProfilePreference() {
      try {
        const snapshot = {
          username: usernameInput.value || '',
          color: colorPicker.value || '#2563eb',
          avatarImage: avatarPhotoDataUrl || ''
        };
        window.localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(snapshot));
      } catch {}
    }

    function loadProfilePreference() {
      try {
        const raw = window.localStorage.getItem(PROFILE_STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);

        if (saved && typeof saved.username === 'string' && saved.username.trim()) {
          usernameInput.value = saved.username;
        }

        if (saved && typeof saved.color === 'string') {
          colorPicker.value = saved.color;
        }

        // Restaurar foto de avatar se existir
        if (saved && typeof saved.avatarImage === 'string' && saved.avatarImage.startsWith('data:image/')) {
          avatarPhotoDataUrl = saved.avatarImage;
          
          // Atualizar preview para mostrar a foto restaurada
          refreshAvatarPreview();
          
          // Fazer upload automático em background para obter URL pública
          // (sem bloquear a interação do usuário)
          if (supabase && currentUser) {
            console.log('[DEBUG] Restaurando foto de avatar do localStorage e fazendo upload...');
            avatarUploadInProgress = true;
            avatarUploadPromise = uploadAvatarToStorage(avatarPhotoDataUrl)
              .then(function (publicUrl) {
                avatarPhotoUrl = publicUrl || avatarPhotoDataUrl;
                console.log('[DEBUG] Avatar restaurado e uploadado automaticamente');
                return publicUrl;
              })
              .catch(function (error) {
                console.error('[DEBUG] Erro ao fazer upload automático de avatar:', error);
                avatarPhotoUrl = ''; // Deixar vazio, vai reter ir no data URL se necessário
              })
              .finally(function () {
                avatarUploadInProgress = false;
              });
          } else {
            // Fallback se Supabase não disponível ainda
            avatarPhotoUrl = avatarPhotoDataUrl;
          }
        }
      } catch {}
    }

    function normalizeMessage(payload) {
      return {
        id: payload.id || payload.created_at || payload.createdAt || payload.audio_url || payload.text,
        userId: payload.user_id || payload.userId || '',
        username: payload.username || 'Anônimo',
        emoji: payload.emoji || DEFAULT_AVATAR_SYMBOL,
        avatarType: payload.avatar_type || payload.avatarType || 'emoji',
        avatarImage: payload.avatar_image || payload.avatarImage || '',
        color: payload.color || '#2563eb',
        type: payload.type,
        text: payload.text,
        audioUrl: payload.audio_url || payload.audioUrl || ''
      };
    }

    function loadLocalHistoryMessages() {
      try {
        const raw = window.localStorage.getItem(LOCAL_HISTORY_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(function (item) {
          return item && typeof item === 'object' && (item.text || item.audio_url || item.audioUrl);
        });
      } catch {
        return [];
      }
    }

    function saveMessageToLocalHistory(payload) {
      try {
        const history = loadLocalHistoryMessages();
        const key = buildMessageKey(payload);
        const next = history.filter(function (item) {
          return buildMessageKey(item) !== key;
        });

        next.push({
          id: payload.id || '',
          user_id: payload.user_id || payload.userId || '',
          username: payload.username || 'Anônimo',
          text: payload.text || '',
          type: payload.type || 'text',
          audio_url: payload.audio_url || payload.audioUrl || '',
          created_at: payload.created_at || payload.createdAt || new Date().toISOString(),
          emoji: payload.emoji || '',
          avatar_type: payload.avatar_type || payload.avatarType || 'none',
          avatar_image: payload.avatar_image || payload.avatarImage || '',
          color: payload.color || '#2563eb'
        });

        if (next.length > MAX_LOCAL_HISTORY) {
          next.splice(0, next.length - MAX_LOCAL_HISTORY);
        }

        window.localStorage.setItem(LOCAL_HISTORY_KEY, JSON.stringify(next));
      } catch {}
    }

    function hydrateMessagesFromLocalHistory() {
      const cached = loadLocalHistoryMessages();
      if (!cached.length) return 0;

      cached
        .sort(function (a, b) {
          return new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime();
        })
        .forEach(function (row) {
          renderIncomingMessage(buildMessageKey(row), row);
        });

      return cached.length;
    }

    function createAvatarBadge(avatarType, avatarImage, emoji) {
      const badge = document.createElement('span');
      badge.className = 'avatar-badge';

      // Avatar é opcional - permite 'none' sem exibir nada
      if (avatarType === 'none' || !avatarType) {
        badge.textContent = ''; // Sem avatar visível
      } else if (avatarType === 'photo' && avatarImage) {
        const img = document.createElement('img');
        img.src = avatarImage;
        img.alt = 'avatar';
        badge.appendChild(img);
      } else if (emoji) {
        badge.textContent = emoji;
      } else {
        badge.textContent = DEFAULT_AVATAR_SYMBOL; // fallback se nada especificado
      }

      return badge;
    }

    function buildUsernameTag(message) {
      const usernameTag = document.createElement('span');
      usernameTag.className = 'username';

      const avatar = createAvatarBadge(message.avatarType, message.avatarImage, message.emoji);
      const nameLabel = document.createElement('span');

      usernameTag.dataset.userId = message.userId || '';
      usernameTag.dataset.username = message.username || 'Anônimo';
      usernameTag.dataset.emoji = message.emoji || DEFAULT_AVATAR_SYMBOL;
      usernameTag.dataset.avatarType = message.avatarType || 'emoji';
      usernameTag.dataset.avatarImage = message.avatarImage || '';
      usernameTag.dataset.color = message.color || '#2563eb';
      usernameTag.title = 'Clique para abrir conversa privada';

      return usernameTag;
    }

    function refreshAvatarPreview() {
      if (!avatarPreview) return;

      const previewType = avatarPhotoDataUrl ? 'photo' : 'none';
      avatarPreview.appendChild(createAvatarBadge(previewType, avatarPhotoDataUrl, ''));
    }

    function renderTextMessage(payload) {
      const parsedFile = parseFileMessage(payload.text);
      if (parsedFile) {
        renderFileMessage(payload, parsedFile);
        return;
      }

      const msgElem = document.createElement('div');
      msgElem.className = 'message';
      msgElem.appendChild(buildUsernameTag(payload));
      const textSpan = document.createElement('span');
      textSpan.className = 'msg-text';
      textSpan.textContent = payload.text;
      msgElem.appendChild(textSpan);
      const timeTag = createMessageTimeTag(payload.created_at || payload.createdAt, 'message-time');
      if (timeTag) msgElem.appendChild(timeTag);
      appendMessageToDOM(msgElem);
    }

    function renderFileMessage(payload, fileMeta) {
      const msgElem = document.createElement('div');
      msgElem.className = 'message';
      msgElem.appendChild(buildUsernameTag(payload));

      const isImage = fileMeta.mime && fileMeta.mime.startsWith('image/');
      if (isImage) {
        const img = document.createElement('img');
        img.src = fileMeta.url;
        img.alt = fileMeta.name || 'Imagem enviada';
        img.style.cssText = 'max-width:160px;max-height:120px;border-radius:6px;border:1px solid #cbd5e1;margin-top:4px;display:block';
        const wrapper = document.createElement('span');
        wrapper.className = 'msg-text file-message';
        wrapper.appendChild(img);
        msgElem.appendChild(wrapper);
      } else {
        const link = document.createElement('a');
        link.href = fileMeta.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.style.color = '#60a5fa';
        const sizeText = typeof fileMeta.size === 'number' ? ` (${formatFileSize(fileMeta.size)})` : '';
        link.textContent = `📎 ${fileMeta.name || 'Arquivo'}${sizeText}`;
        const wrapper = document.createElement('span');
        wrapper.className = 'msg-text';
        wrapper.appendChild(link);
        msgElem.appendChild(wrapper);
      }

      const timeTag = createMessageTimeTag(payload.created_at || payload.createdAt, 'message-time');
      if (timeTag) msgElem.appendChild(timeTag);
      appendMessageToDOM(msgElem);
    }

    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let unitIndex = 0;
      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }
      return `${value.toFixed(value >= 10 || unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
    }

    function parseFileMessage(text) {
      if (typeof text !== 'string' || !text.startsWith(FILE_MESSAGE_PREFIX)) return null;
      const encoded = text.slice(FILE_MESSAGE_PREFIX.length);
      try {
        const parsed = JSON.parse(encoded);
        if (!parsed || typeof parsed !== 'object') return null;
        if (typeof parsed.url !== 'string' || parsed.url.trim() === '') return null;
        return {
          name: typeof parsed.name === 'string' ? parsed.name : 'Arquivo',
          url: parsed.url,
          mime: typeof parsed.mime === 'string' ? parsed.mime : '',
          size: typeof parsed.size === 'number' ? parsed.size : 0
        };
      } catch {
        return null;
      }
    }

    function createFileMessageText(fileMeta) {
      return `${FILE_MESSAGE_PREFIX}${JSON.stringify(fileMeta)}`;
    }

    function buildSafeFileName(name) {
      const raw = String(name || 'arquivo');
      return raw.replace(/[^a-zA-Z0-9._-]/g, '_');
    }

    function scrollMessagesToLatest() {
      requestAnimationFrame(function () {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        userScrolledUp = false;
        pendingNewMessages = 0;

    function updateNewMessagesBadge() {
      if (!newMessagesBtn) return;

      const userId = payload.user_id || payload.userId || '';
      const username = payload.username || 'Anônimo';
      const isTyping = Boolean(payload.is_typing || payload.isTyping);

      if (!userId || (currentUser && userId === currentUser.uid)) return;

    async function buildAvatarDataUrl(file) {
      return new Promise(function (resolve, reject) {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = function () {
          const size = 96;
          const side = Math.min(img.naturalWidth, img.naturalHeight);
          const sx = (img.naturalWidth - side) / 2;
          const sy = (img.naturalHeight - side) / 2;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Sem contexto de imagem'));
            return;
          }

          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          URL.revokeObjectURL(objectUrl);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };

        img.onerror = function () {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Falha ao processar imagem'));
        };

        img.src = objectUrl;
      });
    }

    async function uploadAvatarToStorage(dataUrl) {
      // Fazer upload da foto de avatar para bucket do Supabase
      // Retorna URL pública da foto para persistir no banco
      if (!supabase || !currentUser || !dataUrl) return dataUrl;

      try {
        // Converter data URL para Blob
        const response = await fetch(dataUrl);
        const blob = await response.blob();

        // Upload para bucket
        const path = `${currentUser.uid}/avatar-${Date.now()}.jpeg`;
        const bucket = supabase.storage.from(supabaseConfig.audioBucket);

        const { error: uploadError } = await bucket.upload(path, blob, {
          contentType: 'image/jpeg',
          upsert: false
        });

        if (uploadError) throw uploadError;

        // Obter URL pública da foto
        const { data: publicUrlData } = bucket.getPublicUrl(path);
        const publicUrl = publicUrlData && publicUrlData.publicUrl;

        console.log('[DEBUG] Avatar foto salvo em:', publicUrl);
        return publicUrl || dataUrl; // Fallback para data URL
      } catch (error) {
        console.error('[DEBUG] Erro ao fazer upload de avatar:', error);
        return dataUrl; // Fallback: usar data URL se upload falhar
      }
    }

    function readEmailJsConfig() {
      try {
        const raw = window.localStorage.getItem(EMAILJS_CONFIG_STORAGE_KEY);
        if (!raw) {
          return { ...EMAILJS_DEFAULT_CONFIG };
        }

        const parsed = JSON.parse(raw);
        return {
          publicKey: String(parsed.publicKey || EMAILJS_DEFAULT_CONFIG.publicKey),
          serviceId: String(parsed.serviceId || EMAILJS_DEFAULT_CONFIG.serviceId),
          templateId: String(parsed.templateId || EMAILJS_DEFAULT_CONFIG.templateId)
        };
      } catch {
        return { ...EMAILJS_DEFAULT_CONFIG };
      }
    }

    function saveEmailJsConfig(config) {
      if (!config) return;
      const snapshot = {
        publicKey: String(config.publicKey || '').trim(),
        serviceId: String(config.serviceId || '').trim(),
        templateId: String(config.templateId || '').trim()
      };

      window.localStorage.setItem(EMAILJS_CONFIG_STORAGE_KEY, JSON.stringify(snapshot));
      emailJsConfig = snapshot;
      emailJsInitialized = false;
    }

    function requestAndSaveEmailJsConfig() {
      const current = readEmailJsConfig();
      const publicKey = window.prompt('Configure o EmailJS. Informe a Public Key:', current.publicKey || '');
      if (publicKey === null) return false;

      const serviceId = window.prompt('Informe o Service ID do EmailJS:', current.serviceId || '');
      if (serviceId === null) return false;

      const templateId = window.prompt('Informe o Template ID do EmailJS:', current.templateId || '');
      if (templateId === null) return false;

      const nextConfig = {
        publicKey: publicKey.trim(),
        serviceId: serviceId.trim(),
        templateId: templateId.trim()
      };

      if (!isEmailJsConfigReady(nextConfig)) {
        alert('Configuração incompleta. Preencha Public Key, Service ID e Template ID válidos.');
        return false;
      }

      saveEmailJsConfig(nextConfig);
      return true;
    }

    function isEmailJsConfigReady(config) {
      if (!config) return false;
      const publicKey = String(config.publicKey || '');
      const serviceId = String(config.serviceId || '');
      const templateId = String(config.templateId || '');
      return (
        publicKey.length > 0 && !publicKey.startsWith('SEU_') &&
        serviceId.length > 0 && !serviceId.startsWith('SEU_') &&
        templateId.length > 0 && !templateId.startsWith('SEU_')
      );
    }

    function ensureEmailJsReady() {
      if (typeof window.emailjs === 'undefined') {
        return false;
      }

      emailJsConfig = emailJsConfig || readEmailJsConfig();
      if (!isEmailJsConfigReady(emailJsConfig)) {
        return false;
      }

      if (!emailJsInitialized) {
        try {
          window.emailjs.init(emailJsConfig.publicKey);
          emailJsInitialized = true;
        } catch {
          return false;
        }
      }

      return true;
    }

    async function loadInitialMessages() {
      if (isLoadingInitialMessages) return; // Prevenir race condition
      isLoadingInitialMessages = true;

      try {
        let data, error;
        
        // Tentar estratégia 1: Carregar todas as colunas
        console.log('[DEBUG] Tentando carregar histórico - Estratégia 1: select(*)...');
        let result = await supabase
          .from(supabaseConfig.messagesTable)
          .select('*')
          .order('created_at', { ascending: false });
        
        data = result.data;
        error = result.error;

        // Se falhar, tentar estratégia 2: Sem especificar colunas
        if (error || !data) {
          console.log('[DEBUG] Estratégia 1 falhou, tentando Estratégia 2: select()...');
          result = await supabase
            .from(supabaseConfig.messagesTable)
            .select()
            .order('created_at', { ascending: false });
          
          data = result.data;
          error = result.error;
        }

        // Se falhar, tentar estratégia 3: Carregar apenas colunas essenciais
        if (error || !data) {
          console.log('[DEBUG] Estratégia 2 falhou, tentando Estratégia 3: colunas essenciais...');
          result = await supabase
            .from(supabaseConfig.messagesTable)
            .select('id,user_id,username,text,type,created_at,emoji,avatar_type,avatar_image,color,audio_url')
            .order('created_at', { ascending: false });
          
          data = result.data;
          error = result.error;
        }

        if (error) {
          console.error('[DEBUG] Erro ao carregar mensagens iniciais após todas as estratégias:', error);
          // Não lançar erro, apenas avisar e continuar
          console.warn('[DEBUG] Histórico não disponível - RLS pode estar bloqueando leitura');
          const loadedFromLocal = hydrateMessagesFromLocalHistory();
          if (loadedFromLocal > 0) {
            console.log('[DEBUG] Histórico local carregado:', loadedFromLocal);
          }
          return;
        }

        console.log('[DEBUG] Carregadas', (data || []).length, 'mensagens iniciais');
        
        // Reverter para ordem cronológica (mais antigo → mais recente)
        (data || []).reverse().forEach(function (row) {
          renderIncomingMessage(buildMessageKey(row), row);
          // Atualizar timestamp de última sincronização
          const rowTime = new Date(row.created_at).getTime();
          if (!lastSyncTimestamp || rowTime > lastSyncTimestamp) {
            lastSyncTimestamp = rowTime;
          }
        });

        console.log('[DEBUG] Histórico inicial carregado e renderizado com sucesso');

        if (!data || data.length === 0) {
          const loadedFromLocal = hydrateMessagesFromLocalHistory();
          if (loadedFromLocal > 0) {
            console.log('[DEBUG] Sem histórico no banco. Histórico local carregado:', loadedFromLocal);
          }
        }
      } finally {
        isLoadingInitialMessages = false;
      }
    }

    async function pollLatestMessages() {
      if (!supabase || isLoadingInitialMessages) return;

      try {
        let query = supabase
          .from(supabaseConfig.messagesTable)
          .select('*')
          .order('created_at', { ascending: false });

        // Se já sincronizou antes, carregar apenas mensagens DEPOIS do último timestamp
        if (lastSyncTimestamp) {
          const afterIso = new Date(lastSyncTimestamp + 1).toISOString(); // +1ms para evitar duplicação
          query = query.gt('created_at', afterIso);
        }

        const { data, error } = await query.limit(50); // Limitar para não sobrecarregar

        if (error) {
          console.error('[DEBUG] Erro em polling:', error);
          return;
        }

        if (!data || data.length === 0) {
          return; // Nenhuma mensagem nova
        }

        console.log('[DEBUG] Poll encontrou', data.length, 'mensagens novas');
        
        // Reverter para ordem cronológica e renderizar
        data.reverse().forEach(function (row) {
          renderIncomingMessage(buildMessageKey(row), row);
          // Atualizar timestamp
          const rowTime = new Date(row.created_at).getTime();
          if (rowTime > lastSyncTimestamp) {
            lastSyncTimestamp = rowTime;
          }
        });
      } catch (err) {
        console.error('[DEBUG] Exceção em polling:', err);
      }
    }

    function startMessagePolling() {
      if (messagePollingInterval) {
        clearInterval(messagePollingInterval);
      }

      pollLatestMessages().catch(function () {});
      messagePollingInterval = setInterval(function () {
        pollLatestMessages().catch(function () {});
      }, 2500);
    }

    function updatePresenceCount() {

      const presenceState = presenceChannel.presenceState();
      const onlineCount = Object.keys(presenceState).length;
      onlineCountElem.textContent = String(onlineCount);

    async function trackPresence() {
      if (!presenceChannel) return;
      const profile = getCurrentProfile();
      await presenceChannel.track({ username: profile.username, updatedAt: Date.now() });
    }

    function bindPresence() {
      presenceChannel = supabase.channel(`presence:${supabaseConfig.roomName}`, {
        config: { presence: { key: currentUser.uid } }
      });

      presenceChannel.on('presence', { event: 'sync' }, updatePresenceCount);
      presenceChannel.subscribe(async function (status) {

          try {
            await trackPresence();

    function bindMessageRealtime() {
      messagesChannel = supabase
        .channel(`messages:${supabaseConfig.roomName}`)
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: supabaseConfig.messagesTable },
          function (payload) {
            if (!payload || !payload.new) return;
            renderIncomingMessage(buildMessageKey(payload.new), payload.new);
          }
        )
        .subscribe();
    }

    function bindBroadcastRealtime() {
      broadcastReady = false;
      broadcastChannel = supabase
        .channel(`broadcast:${supabaseConfig.roomName}`)
        .on('broadcast', { event: 'message' }, function (payload) {
          if (!payload || !payload.payload) return;
          const incoming = payload.payload;
          const key = buildMessageKey(incoming);
          renderIncomingMessage(key, incoming);
        })
        .on('broadcast', { event: 'private-message' }, function (eventPayload) {
          if (!eventPayload || !eventPayload.payload || !currentUser) return;
          const message = eventPayload.payload;
          if (!message || !message.to_user_id || !message.from_user_id) return;
          if (message.to_user_id !== currentUser.uid && message.from_user_id !== currentUser.uid) return;
          storePrivateMessage(message);
        })
        .on('broadcast', { event: 'typing' }, function (eventPayload) {
          if (!eventPayload || !eventPayload.payload) return;
          applyRemoteTyping(eventPayload.payload);
        })
        .subscribe(function (status) {
          if (status === 'SUBSCRIBED') {
            broadcastReady = true;
          }
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
            broadcastReady = false;
          }
        });
    }

    async function sendOnBroadcastChannel(eventName, payload) {
      if (!broadcastChannel) return false;

      if (!broadcastReady) {
        const waitUntil = Date.now() + 2200;
        while (!broadcastReady && Date.now() < waitUntil) {
          await new Promise(function (resolve) {
            setTimeout(resolve, 110);
          });
        }
      }

      if (!broadcastReady) return false;

      try {
        const result = await broadcastChannel.send({ type: 'broadcast', event: eventName, payload });
        return result === 'ok' || typeof result === 'undefined';
      } catch {
        return false;
      }
    }

    async function checkDatabaseAccess() {
      const { error } = await supabase
        .from(supabaseConfig.messagesTable)
        .select('id')
        .limit(1);

      if (error) {
        dbReady = false;
        useBroadcastFallback = true;
        return;
      }

      dbReady = true;
      useBroadcastFallback = false;
    }

    function formatSupabaseError(error) {
      if (!error) return 'erro desconhecido';
      const parts = [];
      if (error.code) parts.push(`code=${error.code}`);
      if (error.message) parts.push(error.message);
      if (error.details) parts.push(error.details);
      if (error.hint) parts.push(`hint=${error.hint}`);
      if (parts.length === 0) return String(error);
      return parts.join(' | ');
    }

    function resolveUserIdByUsername(username) {
      if (!presenceChannel || !username || !currentUser) return '';
      const state = presenceChannel.presenceState();
      const entries = Object.entries(state || {});

      for (const [userId, metas] of entries) {
        if (userId === currentUser.uid) continue;
        const list = Array.isArray(metas)
          ? metas
          : (metas && Array.isArray(metas.metas) ? metas.metas : []);
        const matched = list.some(function (meta) {
          return (meta && (meta.username || 'Anônimo')) === username;
        });
        if (matched) return userId;
      }

      const cached = recentUserIdsByUsername.get(String(username));
      if (cached && cached !== currentUser.uid) return cached;

      return '';
    }

    function getConversationKey(userA, userB) {
      return [String(userA), String(userB)].sort().join('::');
    }

    function resolvePrivatePartyId(userId, username) {
      if (userId) return String(userId);
      const key = normalizeUsernameKey(username);
      return key ? `name:${key}` : 'name:anon';
    }

    function flashPrivateTitle(senderName) {

    function playPrivateNotificationTone() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.value = 920;

        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.26);

        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.28);
      } catch {}
    }

    function setPrivateUnreadState(isUnread) {
      if (!privateChatElem) return;
      const header = privateChatElem.querySelector('.private-header');
      if (!header) return;
      header.classList.toggle('private-unread', Boolean(isUnread));

    function notifyIncomingPrivateMessage(message, isCurrentConversation) {

    function appendPrivateMessage(message) {

      );

    function showPrivateSystemMessage(text) {
      if (!privateMessagesElem) return;

      privateMessagesElem.appendChild(msgElem);

    function renderPrivateConversation() {
      if (!privateMessagesElem || !activePrivateTarget || !currentUser) return;
      privateMessagesElem.innerHTML = '';
      const selfId = resolvePrivatePartyId(currentUser.uid, usernameInput.value);
      const targetId = activePrivateTarget.conversationId || resolvePrivatePartyId(activePrivateTarget.userId, activePrivateTarget.username);
      const key = getConversationKey(selfId, targetId);
      const conversation = privateConversations.get(key) || [];
      if (conversation.length === 0) {
        showPrivateSystemMessage(`Conversa privada com ${activePrivateTarget.username}.`);
        return;
      }
      conversation.forEach(appendPrivateMessage);
    }

    function storePrivateMessage(message) {
      const messageId = String(message.id || `${message.from_user_id}|${message.to_user_id}|${message.created_at || message.text || Date.now()}`);
      if (renderedPrivateMessageIds.has(messageId)) return;
      renderedPrivateMessageIds.add(messageId);

      const fromId = resolvePrivatePartyId(message.from_user_id, message.from_username);
      const toId = resolvePrivatePartyId(message.to_user_id, message.to_username || message.to_username_key);
      const key = getConversationKey(fromId, toId);
      if (!privateConversations.has(key)) {
        privateConversations.set(key, []);
      }
      const list = privateConversations.get(key);
      list.push(message);
      if (list.length > 120) {
        list.shift();
      }

      const activeConversationKey = (
        activePrivateTarget && currentUser
      )
        ? getConversationKey(
            resolvePrivatePartyId(currentUser.uid, usernameInput.value),
            activePrivateTarget.conversationId || resolvePrivatePartyId(activePrivateTarget.userId, activePrivateTarget.username)
          )
        : '';
      const isCurrentConversation = Boolean(activeConversationKey) && key === activeConversationKey;
      const isIncomingFromOtherUser = Boolean(currentUser) && message.from_user_id !== currentUser.uid;

      if (isIncomingFromOtherUser && !isCurrentConversation) {
        notifyIncomingPrivateMessage(message, false);
        openPrivateChat({
          userId: message.from_user_id || '',
          username: message.from_username || 'Anônimo',
          color: message.from_color || '#2563eb'
        });
        return;
      }

      if (isIncomingFromOtherUser && isCurrentConversation) {
        notifyIncomingPrivateMessage(message, true);
      }

      if (
        activePrivateTarget &&
        currentUser &&
        isCurrentConversation
      ) {
        if (!privateMessagesElem || privateMessagesElem.children.length === 0) {
          renderPrivateConversation();
        } else {
          appendPrivateMessage(message);
        }
      }
    }

    function getPrivateOutChannel(targetUserId) {
      if (privateOutChannels.has(targetUserId)) {
        return privateOutChannels.get(targetUserId);
      }

      const channel = supabase.channel(`private-inbox:${supabaseConfig.roomName}:${targetUserId}`);
      channel.subscribe();
      privateOutChannels.set(targetUserId, channel);
      return channel;
    }

    async function sendPrivateMessage() {
      if (!activePrivateTarget || !privateInputElem || !currentUser) return;

      const selfNameKey = normalizeUsernameKey(getCurrentProfile().username);
      const targetNameKey = normalizeUsernameKey(activePrivateTarget.username);
      if (activePrivateTarget.userId && activePrivateTarget.userId === currentUser.uid) return;
      if (targetNameKey && targetNameKey === selfNameKey) return;
      if (!activePrivateTarget.userId && !targetNameKey) return;

      const text = privateInputElem.value.trim();
      if (!text) return;

      const profile = getCurrentProfile();
      const toUsernameKey = normalizeUsernameKey(activePrivateTarget.username);
      const payload = {
        id: `pm-${currentUser.uid}-${Date.now()}`,
        from_user_id: currentUser.uid,
        from_username: profile.username,
        from_emoji: profile.emoji,
        from_avatar_type: profile.avatarType,
        from_avatar_image: profile.avatarImage,
        from_color: profile.color,
        to_user_id: activePrivateTarget.userId || '',
        to_username: activePrivateTarget.username,
        to_username_key: toUsernameKey,
        text,
        created_at: new Date().toISOString()
      };

      try {
        let delivered = await sendOnBroadcastChannel('private-message', payload);

        // Compatibilidade com clientes antigos que ainda escutam canal privado dedicado.
        if (!delivered && activePrivateTarget.userId) {
          const outChannel = getPrivateOutChannel(activePrivateTarget.userId);
          const result = await outChannel.send({ type: 'broadcast', event: 'private-message', payload });
          delivered = result === 'ok' || typeof result === 'undefined';
        }

        if (!delivered) throw new Error('Falha ao entregar mensagem privada');

        storePrivateMessage(payload);
        privateInputElem.value = '';
        privateInputElem.focus();
      } catch {
        alert('Não foi possível enviar a mensagem privada.');
      }
    }

    function ensurePrivateChatWindow() {
      if (privateChatElem) return;

      privateChatElem = document.createElement('div');
      privateChatElem.className = 'private-chat';

      const header = document.createElement('div');
      header.className = 'private-header';

      privateTitleElem = document.createElement('span');
