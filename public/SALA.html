<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Bate-Papo</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://img.freepik.com/premium-vector/playful-favela-doodle-vector-art-illustration-with-bold-colors-graffiti-white-background_992796-629.jpg?w=2000') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }
    .chat-container {
      max-width: 800px;
      margin: 40px auto;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      padding: 32px;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
      background: #f3f4f6;
      font-size: 1.2em;
    }
    .message {
      margin-bottom: 12px;
    }
    .message span.username {
      font-weight: bold;
      margin-right: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }
    .message span.username:hover {
      color: #d32f2f;
      text-decoration: none;
    }
    .audio-message {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-area {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1.2em;
    }
    .input-area button {
      padding: 16px 32px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 1.2em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-area button:hover {
      background: #60a5fa;
      color: #222;
    }
    .input-area select,
    .input-area input[type="color"] {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1.1em;
      margin-right: 4px;
      min-width: 48px;
    }
    .recording {
      color: #d32f2f;
      font-weight: bold;
      margin-left: 8px;
      animation: blink 1s steps(2, start) infinite;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes blink {
      to {
        visibility: hidden;
      }
    }
    @media (max-width: 600px) {
      .chat-container {
        padding: 8px;
      }
      .input-area {
        gap: 6px;
      }
      .input-area input[type="text"] {
        padding: 8px;
        font-size: 1em;
      }
      .input-area button {
        padding: 8px 12px;
        font-size: 1em;
      }
    }
    .private-chat {
      position: fixed;
      right: 30px;
      bottom: 60px;
      width: 370px;
      background: rgba(255,255,255,0.98);
      border: 2px solid #2563eb;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      height: 440px;
      animation: fadeInUp 0.3s;
      transition: height 0.2s, width 0.2s, bottom 0.2s;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      border-top: 6px solid #2563eb;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(80px);} 
      to { opacity: 1; transform: translateY(0);} 
    }
    .private-header {
      background: linear-gradient(90deg, #2563eb 60%, #60a5fa 100%);
      color: #fff;
      padding: 14px 20px;
      border-radius: 18px 18px 0 0;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      letter-spacing: 0.5px;
      font-size: 1.13em;
    }
    .private-header .header-btns { display: flex; gap: 8px; }
    .private-header button {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      font-size: 1.3em;
      cursor: pointer;
      padding: 0 6px;
      height: 32px;
      width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .private-header button:hover { background: #1746a0; }
    .private-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f6f8fa;
      font-size: 1.08em;
      transition: height 0.2s;
      border-radius: 0 0 12px 12px;
      margin-bottom: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04) inset;
    }
    .private-input-area {
      display: flex;
      gap: 8px;
      padding: 12px 10px;
      border-top: 1px solid #eee;
      background: #fafdff;
      transition: height 0.2s;
      align-items: center;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.03) inset;
    }
    .private-input-area input[type="text"] {
      flex: 1 1 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #b3c6e0;
      font-size: 1.08em;
      min-width: 0;
      background: #f7faff;
      transition: border 0.2s;
    }
    .private-input-area input[type="text"]:focus {
      border: 1.5px solid #2563eb;
      outline: none;
      background: #fff;
    }
    .private-input-area label {
      display: flex;
      align-items: center;
      cursor: pointer;
      margin: 0 2px;
      border-radius: 6px;
      transition: background 0.2s;
      padding: 2px 4px;
    }
    .private-input-area label:hover { background: #e3e8f7; }
    .private-input-area label span {
      font-size: 1.5em;
      padding: 0 4px;
      line-height: 1;
      color: #2563eb;
      transition: color 0.2s;
    }
    .private-input-area label:hover span { color: #1746a0; }
    .private-input-area input[type="file"] { display: none; }
    .private-input-area button[type="submit"] {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.2s;
      margin-left: 2px;
      height: 40px;
      display: flex;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .private-input-area button[type="submit"]:hover {
      background: #60a5fa;
      color: #222;
    }
    .private-file-message {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .private-file-message a {
      color: #2563eb;
      text-decoration: underline;
      word-break: break-all;
    }
    .private-file-message img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .minimized {
      height: 46px !important;
      width: 220px !important;
      overflow: hidden;
      min-width: 180px;
      max-width: 370px;
      border-radius: 18px;
    }
    .minimized .private-messages,
    .minimized .private-input-area { display: none !important; }
    #online-users {
      text-align: right;
      font-size: 1.18em;
      color: #2563eb;
      margin-bottom: 8px;
      font-family: 'Permanent Marker', cursive, sans-serif;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #fff, 2px 2px 2px #0002;
      -webkit-user-select: none;
      user-select: none;
    }
    .online-icon { font-size: 1.2em; }
    .city-label { font-size: 1.1em; }
    #weather-box {
      position: fixed;
      right: 36px;
      bottom: 24px;
      background: rgba(255,255,255,0.93);
      border-radius: 12px;
      box-shadow: 0 2px 8px #0002;
      padding: 12px 18px;
      font-family: 'Permanent Marker', cursive, sans-serif;
      font-size: 1.08em;
      color: #2563eb;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    (function(){
      const emailJsUserId = 'SEU_USER_ID';
      if (typeof emailjs !== 'undefined' && emailJsUserId !== 'SEU_USER_ID') {
        emailjs.init(emailJsUserId);
      }
    })();
  </script>
</head>
<body>
  <div class="chat-container">
    <div id="online-users">
      <span id="onlineCount">1</span>
      <span class="online-icon">🧑</span>
      <span id="onlineText">pessoa online</span>
    </div>
    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Mensagens do chat"></div>
    <form class="input-area" id="mainChatForm" autocomplete="off">
      <label class="sr-only" for="emojiSelect">Emoji</label>
      <select id="emojiSelect" title="Escolha um emoji">
        <option value="😀">😀</option><option value="😎">😎</option><option value="😂">😂</option>
        <option value="😍">😍</option><option value="🤩">🤩</option><option value="🥳">🥳</option>
        <option value="😇">😇</option><option value="🤠">🤠</option><option value="👽">👽</option>
        <option value="🦁">🦁</option><option value="🐱">🐱</option><option value="🐶">🐶</option>
        <option value="⚽">⚽</option><option value="🎮">🎮</option><option value="🎤">🎤</option>
      </select>
      <label class="sr-only" for="colorPicker">Cor do nome</label>
      <input type="color" id="colorPicker" value="#2563eb" title="Escolha a cor do nome">
      <label class="sr-only" for="username">Nome de usuário</label>
      <input type="text" id="username" placeholder="Seu nome" maxlength="16">
      <label class="sr-only" for="messageInput">Mensagem</label>
      <input type="text" id="messageInput" placeholder="Digite sua mensagem...">
      <button type="submit">Enviar</button>
      <button id="audioBtn" type="button">🎤 Áudio</button>
      <span id="recordingStatus" class="recording" hidden>Gravando...</span>
    </form>
  </div>
  <div id="weather-box">
    <span id="weather-temp">--°C</span>
    <span id="weather-desc"></span>
    <span id="weather-icon"></span>
    <span class="city-label">BH</span>
  </div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { supabaseConfig } from './firebase-config.js';

    const messagesDiv = document.getElementById('messages');
    const mainChatForm = document.getElementById('mainChatForm');
    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('messageInput');
    const emojiSelect = document.getElementById('emojiSelect');
    const colorPicker = document.getElementById('colorPicker');
    const audioBtn = document.getElementById('audioBtn');
    const recordingStatus = document.getElementById('recordingStatus');
    const onlineCountElem = document.getElementById('onlineCount');
    const onlineTextElem = document.getElementById('onlineText');

    let mainMessageCount = 0;
    let currentUser = null;
    let mediaRecorder;
    let audioChunks = [];
    let audioTimeout;
    let canUseRealtime = false;
    let useBroadcastFallback = false;
    const FORCE_BROADCAST_MODE = false;
    let presenceChannel = null;
    let messagesChannel = null;
    let supabase = null;
    const renderedMessageKeys = new Set();

    function isSupabaseConfigured() {
      return (
        typeof supabaseConfig.url === 'string' &&
        typeof supabaseConfig.anonKey === 'string' &&
        !supabaseConfig.url.startsWith('COLE_') &&
        !supabaseConfig.anonKey.startsWith('COLE_')
      );
    }

    function getOrCreateClientId() {
      const saved = window.localStorage.getItem('chatvista.clientId');
      if (saved) return saved;
      const fallback = `user-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const generated = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : fallback;
      window.localStorage.setItem('chatvista.clientId', generated);
      return generated;
    }

    function normalizeMessage(payload) {
      return {
        id: payload.id || payload.created_at || payload.createdAt || payload.audio_url || payload.text,
        username: payload.username || 'Anônimo',
        emoji: payload.emoji || '😀',
        color: payload.color || '#2563eb',
        type: payload.type,
        text: payload.text,
        audioUrl: payload.audio_url || payload.audioUrl || ''
      };
    }

    function buildUsernameTag(username, emoji, color) {
      const usernameTag = document.createElement('span');
      usernameTag.className = 'username';
      usernameTag.style.color = color;
      usernameTag.textContent = `${emoji} ${username}:`;
      return usernameTag;
    }

    function renderTextMessage(payload) {
      const msgElem = document.createElement('div');
      msgElem.className = 'message';
      msgElem.appendChild(buildUsernameTag(payload.username, payload.emoji, payload.color));
      msgElem.append(` ${payload.text}`);
      messagesDiv.appendChild(msgElem);
    }

    function renderAudioMessage(payload) {
      const msgElem = document.createElement('div');
      msgElem.className = 'audio-message';
      msgElem.appendChild(buildUsernameTag(payload.username, payload.emoji, payload.color));
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = payload.audioUrl;
      audio.style.verticalAlign = 'middle';
      msgElem.appendChild(audio);
      messagesDiv.appendChild(msgElem);
    }

    function renderIncomingMessage(messageKey, payload) {
      if (renderedMessageKeys.has(messageKey)) return;
      renderedMessageKeys.add(messageKey);
      const message = normalizeMessage(payload);
      if (message.type === 'audio' && message.audioUrl) renderAudioMessage(message);
      else if (message.type === 'text' && message.text) renderTextMessage(message);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function getCurrentProfile() {
      return { username: usernameInput.value.trim() || 'Anônimo', emoji: emojiSelect.value, color: colorPicker.value };
    }

    function setInputsDisabled(disabled) {
      usernameInput.disabled = disabled;
      messageInput.disabled = disabled;
      emojiSelect.disabled = disabled;
      colorPicker.disabled = disabled;
      audioBtn.disabled = disabled;
      const submitBtn = mainChatForm.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = disabled;
    }

    async function loadInitialMessages() {
      const { data, error } = await supabase
        .from(supabaseConfig.messagesTable)
        .select('*')
        .order('created_at', { ascending: false })
        .limit(200);

      if (error) throw error;

      (data || []).reverse().forEach(function (row) {
        renderIncomingMessage(String(row.id || row.created_at), row);
      });
    }

    function updatePresenceCount() {
      if (!presenceChannel) return;
      const presenceState = presenceChannel.presenceState();
      const onlineCount = Object.keys(presenceState).length;
      onlineCountElem.textContent = String(onlineCount);
      onlineTextElem.textContent = onlineCount === 1 ? 'pessoa online' : 'pessoas online';
    }

    async function trackPresence() {
      if (!presenceChannel) return;
      const profile = getCurrentProfile();
      await presenceChannel.track({ username: profile.username, updatedAt: Date.now() });
    }

    function bindPresence() {
      presenceChannel = supabase.channel(`presence:${supabaseConfig.roomName}`, {
        config: { presence: { key: currentUser.uid } }
      });

      presenceChannel.on('presence', { event: 'sync' }, updatePresenceCount);
      presenceChannel.subscribe(async function (status) {
        if (status === 'SUBSCRIBED') {
          try {
            await trackPresence();
          } catch {
            onlineCountElem.textContent = '0';
            onlineTextElem.textContent = 'erro de presença';
          }
        }
      });
    }

    function bindMessageRealtime() {
      messagesChannel = supabase
        .channel(`messages:${supabaseConfig.roomName}`)
        .on(
          'postgres_changes',
          { event: 'INSERT', schema: 'public', table: supabaseConfig.messagesTable },
          function (payload) {
            if (!payload || !payload.new) return;
            renderIncomingMessage(String(payload.new.id || payload.new.created_at), payload.new);
          }
        )
        .subscribe();
    }

    function bindBroadcastRealtime() {
      messagesChannel = supabase
        .channel(`broadcast:${supabaseConfig.roomName}`)
        .on('broadcast', { event: 'message' }, function (payload) {
          if (!payload || !payload.payload) return;
          const incoming = payload.payload;
          const key = String(incoming.id || incoming.created_at || `${incoming.user_id}-${incoming.text}-${Date.now()}`);
          renderIncomingMessage(key, incoming);
        })
        .subscribe();
    }

    mainChatForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!canUseRealtime || !currentUser) return;
      const { username, emoji, color } = getCurrentProfile();
      const text = messageInput.value.trim();
      if (!text) return;
      try {
        if (useBroadcastFallback) {
          const payload = {
            id: `${currentUser.uid}-${Date.now()}`,
            user_id: currentUser.uid,
            username,
            emoji,
            color,
            type: 'text',
            text,
            created_at: new Date().toISOString()
          };
          await messagesChannel.send({ type: 'broadcast', event: 'message', payload });
          renderIncomingMessage(String(payload.id), payload);
        } else {
          await supabase.from(supabaseConfig.messagesTable).insert({
            user_id: currentUser.uid,
            username,
            emoji,
            color,
            type: 'text',
            text,
            created_at: new Date().toISOString()
          });
        }
        messageInput.value = '';
        messageInput.focus();
        mainMessageCount++;
      } catch {
        alert('Não foi possível enviar a mensagem.');
      }
    });

    usernameInput.addEventListener('input', function () {
      if (!presenceChannel || !currentUser) return;
      trackPresence().catch(function () {});
    });

    audioBtn.addEventListener('click', async function () {
      if (!canUseRealtime || !currentUser) return;
      if (useBroadcastFallback) {
        alert('Áudio indisponível no modo simplificado. Configure tabela e bucket no Supabase para ativar.');
        return;
      }
      if (mediaRecorder && mediaRecorder.state === 'recording') { stopRecording(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = function (e) { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async function () {
          const profile = getCurrentProfile();
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          try {
            const path = `${currentUser.uid}/${Date.now()}.webm`;
            const bucket = supabase.storage.from(supabaseConfig.audioBucket);
            const { error: uploadError } = await bucket.upload(path, audioBlob, {
              contentType: 'audio/webm',
              upsert: false
            });
            if (uploadError) throw uploadError;

            const { data: publicUrlData } = bucket.getPublicUrl(path);
            const audioUrl = publicUrlData && publicUrlData.publicUrl;
            if (!audioUrl) throw new Error('Sem URL pública para áudio');

            await supabase.from(supabaseConfig.messagesTable).insert({
              user_id: currentUser.uid,
              username: profile.username,
              emoji: profile.emoji,
              color: profile.color,
              type: 'audio',
              audio_url: audioUrl,
              created_at: new Date().toISOString()
            });
          } catch {
            alert('Não foi possível enviar o áudio.');
          }
        };
        mediaRecorder.start();
        recordingStatus.hidden = false;
        audioBtn.textContent = '⏹️ Parar';
        audioTimeout = setTimeout(() => { if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(); }, 10000);
      } catch {
        alert('Permissão do microfone negada ou não suportada.');
      }
    });

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recordingStatus.hidden = true;
        audioBtn.textContent = '🎤 Áudio';
        clearTimeout(audioTimeout);
      }
    }

    async function updateWeather() {
      try {
        const apiKey = 'b6907d289e10d714a6e88b30761fae22';
        const url = `https://api.openweathermap.org/data/2.5/weather?q=Belo%20Horizonte,BR&appid=${apiKey}&units=metric&lang=pt_br`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Falha ao consultar clima');
        const data = await response.json();
        if (!data.main || !data.weather || !data.weather[0]) throw new Error('Resposta inválida');
        document.getElementById('weather-temp').textContent = `${Math.round(data.main.temp)}°C`;
        document.getElementById('weather-desc').textContent = data.weather[0].description;
        const iconContainer = document.getElementById('weather-icon');
        iconContainer.innerHTML = '';
        const icon = document.createElement('img');
        icon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}.png`;
        icon.alt = 'ícone do clima';
        icon.style.verticalAlign = 'middle';
        icon.style.width = '28px';
        icon.style.height = '28px';
        iconContainer.appendChild(icon);
      } catch {
        document.getElementById('weather-temp').textContent = '--°C';
        document.getElementById('weather-desc').textContent = '';
        document.getElementById('weather-icon').innerHTML = '';
      }
    }

    async function initRealtime() {
      if (!isSupabaseConfigured()) {
        setInputsDisabled(true);
        onlineCountElem.textContent = '0';
        onlineTextElem.textContent = 'configure o Supabase';
        const aviso = document.createElement('div');
        aviso.className = 'message';
        aviso.textContent = 'Configure as credenciais do Supabase em firebase-config.js para ativar o chat em tempo real.';
        messagesDiv.appendChild(aviso);
        return;
      }

      try {
        supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
        currentUser = { uid: getOrCreateClientId() };
        canUseRealtime = true;

        if (FORCE_BROADCAST_MODE) {
          useBroadcastFallback = true;
          bindPresence();
          bindBroadcastRealtime();
          setInputsDisabled(false);
          const avisoFallback = document.createElement('div');
          avisoFallback.className = 'message';
          avisoFallback.textContent = 'Chat em modo simplificado: mensagens em tempo real ativas. Configure tabela/bucket no Supabase para histórico e áudio.';
          messagesDiv.appendChild(avisoFallback);
          return;
        }

        try {
          await loadInitialMessages();
          bindPresence();
          bindMessageRealtime();
        } catch {
          useBroadcastFallback = true;
          bindPresence();
          bindBroadcastRealtime();
          setInputsDisabled(false);
          const avisoFallback = document.createElement('div');
          avisoFallback.className = 'message';
          avisoFallback.textContent = 'Chat em modo simplificado: mensagens em tempo real ativas. Configure tabela/bucket no Supabase para histórico e áudio.';
          messagesDiv.appendChild(avisoFallback);
        }
      } catch {
        setInputsDisabled(true);
        const aviso = document.createElement('div');
        aviso.className = 'message';
        aviso.textContent = 'Falha ao conectar ao Supabase. Verifique tabela, bucket e configurações.';
        messagesDiv.appendChild(aviso);
      }
    }

    window.addEventListener('beforeunload', function () {
      if (presenceChannel) presenceChannel.unsubscribe();
      if (messagesChannel) messagesChannel.unsubscribe();
    });

    if (!isSupabaseConfigured()) {
      setInputsDisabled(true);
      onlineCountElem.textContent = '0';
      onlineTextElem.textContent = 'configure o Supabase';
      const aviso = document.createElement('div');
      aviso.className = 'message';
      aviso.textContent = 'Configure as credenciais do Supabase em firebase-config.js para ativar o chat em tempo real.';
      messagesDiv.appendChild(aviso);
    } else {
      initRealtime();
    }

    updateWeather();
    const weatherTimer = setInterval(updateWeather, 600000);
    window.addEventListener('beforeunload', function () { clearInterval(weatherTimer); });
  </script>
</body>
</html>
