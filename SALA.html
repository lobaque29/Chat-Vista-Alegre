<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Bate-Papo</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://img.freepik.com/premium-vector/playful-favela-doodle-vector-art-illustration-with-bold-colors-graffiti-white-background_992796-629.jpg?w=2000') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      box-sizing: border-box;
    }
    .chat-container {
      width: min(860px, calc(100% - 24px));
      margin: clamp(10px, 3vw, 40px) auto;
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      padding: clamp(14px, 2.4vw, 32px);
      display: flex;
      flex-direction: column;
      height: min(82dvh, 860px);
      min-height: 520px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: clamp(12px, 2vw, 18px);
      margin-bottom: 12px;
      background: #f3f4f6;
      font-size: clamp(0.98rem, 1.8vw, 1.15rem);
      line-height: 1.45;
    }
    .message {
      margin-bottom: 12px;
    }
    .message span.username {
      font-weight: bold;
      margin-right: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .message span.username:hover {
      color: #d32f2f;
      text-decoration: none;
    }
    .avatar-badge {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 24px;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      font-size: 0.95em;
      line-height: 1;
      color: #0f172a;
    }
    .avatar-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .username-label {
      display: inline-block;
    }
    .audio-message {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-area {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .input-area input[type="text"] {
      flex: 1;
      min-width: 130px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1.02rem;
    }
    .input-area input[type="file"] {
      max-width: 180px;
      font-size: 0.85rem;
    }
    .avatar-preview {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      overflow: hidden;
    }
    .input-area button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      min-height: 46px;
    }
    .input-area button:hover {
      background: #60a5fa;
      color: #222;
    }
    .input-area select,
    .input-area input[type="color"] {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      margin-right: 4px;
      min-width: 48px;
      min-height: 44px;
    }
    .recording {
      color: #d32f2f;
      font-weight: bold;
      margin-left: 8px;
      animation: blink 1s steps(2, start) infinite;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes blink {
      to {
        visibility: hidden;
      }
    }
    @media (max-width: 900px) {
      body {
        background-attachment: scroll;
      }

      .chat-container {
        width: calc(100% - 16px);
        height: calc(100dvh - 16px);
        min-height: 440px;
        margin: 8px auto;
      }

      .input-area {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        gap: 6px;
      }

      #username,
      #messageInput {
        grid-column: span 3;
      }

      .input-area button {
        width: 100%;
        min-height: 40px;
        padding: 9px 12px;
        font-size: 0.95rem;
      }

      .input-area select,
      .input-area input[type="color"] {
        min-height: 38px;
        min-width: 44px;
        padding: 6px;
      }

      .input-area button[type="submit"],
      #audioBtn {
        grid-column: span 3;
      }
    }

    @media (max-width: 600px) {
      #online-users {
        font-size: 1rem;
      }

      .messages {
        margin-bottom: 10px;
      }
        <span id="avatarPreview" class="avatar-preview" aria-hidden="true"></span>
      right: 12px;
        <input type="file" id="avatarPhotoInput" accept="image/*" title="Escolha sua foto de avatar">
        <button id="clearProfileBtn" type="button" title="Limpar perfil">✕</button>
      width: min(370px, calc(100vw - 24px));
      background: rgba(255,255,255,0.98); /* Fundo branco moderno */
      border: 2px solid #2563eb;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      height: min(440px, 68dvh);
      animation: fadeInUp 0.3s;
      transition: height 0.2s, width 0.2s, bottom 0.2s;
      overflow: hidden;
      /* Removido o fundo de favela */
      /* background-image: none; */
      background-size: cover;
      background-position: center;
      border-top: 6px solid #2563eb;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(80px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .private-header {
      background: linear-gradient(90deg, #2563eb 60%, #60a5fa 100%);
      color: #fff;
      padding: 14px 20px;
      border-radius: 18px 18px 0 0;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      letter-spacing: 0.5px;
      font-size: 1.13em;
    }
    .private-header .header-btns {
      display: flex;
      gap: 8px;
    }
    .private-header button {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      font-size: 1.3em;
      cursor: pointer;
      padding: 0 6px;
      height: 32px;
      width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .private-header button:hover {
      background: #1746a0;
    }
    .private-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f6f8fa;
      font-size: 1.08em;
      transition: height 0.2s;
      border-radius: 0 0 12px 12px;
      margin-bottom: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04) inset;
    }
    .private-input-area {
      display: flex;
      gap: 8px;
      padding: 12px 10px;
      border-top: 1px solid #eee;
      background: #fafdff;
      transition: height 0.2s;
      align-items: center;
      flex-wrap: wrap;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.03) inset;
    }
    .private-input-area input[type="text"] {
      flex: 1 1 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #b3c6e0;
      font-size: 1.08em;
      min-width: 0;
      background: #f7faff;
      transition: border 0.2s;
    }
    .private-input-area input[type="text"]:focus {
      border: 1.5px solid #2563eb;
      outline: none;
      background: #fff;
    }
    .private-input-area label {
      display: flex;
      align-items: center;
      cursor: pointer;
      margin: 0 2px;
      border-radius: 6px;
      transition: background 0.2s;
      padding: 2px 4px;
    }
    .private-input-area label:hover {
      background: #e3e8f7;
    }
    .private-input-area label span {
      font-size: 1.5em;
      padding: 0 4px;
      line-height: 1;
      color: #2563eb;
      transition: color 0.2s;
    }
    .private-input-area label:hover span {
      color: #1746a0;
    }
    .private-input-area input[type="file"] {
      display: none;
    }
    .private-input-area button[type="submit"] {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.2s;
      margin-left: 2px;
      height: 40px;
      display: flex;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .private-input-area button[type="submit"]:hover {
      background: #60a5fa;
      color: #222;
    }
    .private-file-message {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .private-file-message a {
      color: #2563eb;
      text-decoration: underline;
      word-break: break-all;
    }
    .private-file-message img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .private-msg {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: #eaf1ff;
      color: #0f172a;
      max-width: 85%;
      word-break: break-word;
    }
    .private-msg.mine {
      margin-left: auto;
      background: #2563eb;
      color: #fff;
    }
    .private-msg.system {
      margin-left: auto;
      margin-right: auto;
      background: #eef2ff;
      color: #334155;
      text-align: center;
      font-size: 0.95em;
    }
    .minimized {
      height: 46px !important;
      width: 220px !important;
      overflow: hidden;
      min-width: 180px;
      max-width: 370px;
      border-radius: 18px;
        }
    .minimized .private-messages,
    .minimized .private-input-area {
      display: none !important;
    }
    #online-users {
      text-align: right;
      font-size: 1.18em;
      color: #2563eb;
      margin-bottom: 8px;
      font-family: 'Permanent Marker', cursive, sans-serif;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #fff, 2px 2px 2px #0002;
      -webkit-user-select: none;
      user-select: none;
    }
    .online-icon {
      font-size: 1.2em;
    }

    @media (max-width: 700px) {
      .private-chat {
        left: 8px;
        right: 8px;
        width: auto;
        height: min(56dvh, 380px);
        bottom: max(8px, env(safe-area-inset-bottom));
      }

      .private-header {
        padding: 12px 14px;
        font-size: 1em;
      }

      .private-input-area {
        gap: 6px;
        padding: 8px;
      }

      .private-input-area input[type="text"] {
        font-size: 0.95rem;
        padding: 8px;
      }

      .private-input-area button[type="submit"] {
        height: 34px;
        padding: 6px 10px;
        font-size: 0.9rem;
      }

      .private-header button {
        width: 30px;
        height: 30px;
        font-size: 1.1em;
      }
    }

    @media (max-width: 420px) {
      .minimized {
        width: 180px !important;
      }

      .private-header .header-btns {
        gap: 4px;
      }

      .private-header button {
        width: 28px;
        height: 28px;
      }
    }

</head>
<body>
  <div class="chat-container">
    <!-- Contador de pessoas online com emoticon e fonte grafite -->
    <div id="online-users">
      <!-- Removido o emoticon de grupo 👥 -->
      <span id="onlineCount">1</span>
      <span class="online-icon">🧑</span>
      <span id="onlineText">pessoa online</span>
    </div>
    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Mensagens do chat"></div>
    <form class="input-area" id="mainChatForm" autocomplete="off">
      <span id="avatarPreview" class="avatar-preview" aria-hidden="true"></span>
      <label class="sr-only" for="avatarPhotoInput">Foto do avatar</label>
      <input type="file" id="avatarPhotoInput" accept="image/*" title="Escolha sua foto de avatar">
      <button id="clearProfileBtn" type="button" title="Limpar perfil">✕</button>
      <label class="sr-only" for="colorPicker">Cor do nome</label>
      <input type="color" id="colorPicker" value="#2563eb" title="Escolha a cor do nome">
      <label class="sr-only" for="username">Nome de usuário</label>
      <input type="text" id="username" placeholder="Seu nome" maxlength="16">
      <label class="sr-only" for="messageInput">Mensagem</label>
      <input type="text" id="messageInput" placeholder="Digite sua mensagem...">
      <button type="submit">Enviar</button>
      <button id="audioBtn" type="button">🎤 Áudio</button>
      <span id="recordingStatus" class="recording" hidden>Gravando...</span>
    </form>
  </div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { supabaseConfig } from './firebase-config.js';

    const messagesDiv = document.getElementById('messages');
    const mainChatForm = document.getElementById('mainChatForm');
    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('messageInput');
    const avatarPreview = document.getElementById('avatarPreview');
    const avatarPhotoInput = document.getElementById('avatarPhotoInput');
    const clearProfileBtn = document.getElementById('clearProfileBtn');
    const colorPicker = document.getElementById('colorPicker');
    const audioBtn = document.getElementById('audioBtn');
    const recordingStatus = document.getElementById('recordingStatus');
    const onlineCountElem = document.getElementById('onlineCount');
    const onlineTextElem = document.getElementById('onlineText');

    let mainMessageCount = 0;
    let currentUser = null;
    let mediaRecorder;
    let audioChunks = [];
    let audioTimeout;
    let canUseRealtime = false;
    let useBroadcastFallback = false;
    const ENABLE_MESSAGE_HISTORY = false;
    const FORCE_BROADCAST_MODE = false;
    let presenceChannel = null;
    let messagesChannel = null;
    let supabase = null;

    const renderedMessageKeys = new Set();
    const privateConversations = new Map();
    const privateOutChannels = new Map();
    let privateInboxChannel = null;
    let activePrivateTarget = null;
    let privateChatElem = null;
    let privateTitleElem = null;
    let privateMessagesElem = null;
    let privateInputElem = null;
    let privateSendBtn = null;
    let usernameLocked = false;
    let avatarPhotoDataUrl = '';
    const PROFILE_STORAGE_KEY = 'chatvista.profile.v1';
    const DEFAULT_AVATAR_SYMBOL = '👤';

    function isSupabaseConfigured() {
      return (
        typeof supabaseConfig.url === 'string' &&
        typeof supabaseConfig.anonKey === 'string' &&
        !supabaseConfig.url.startsWith('COLE_') &&
        !supabaseConfig.anonKey.startsWith('COLE_')
      );
    }

    function getOrCreateClientId() {
      const saved = window.localStorage.getItem('chatvista.clientId');
      if (saved) return saved;

      const fallback = `user-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const generated = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : fallback;
      window.localStorage.setItem('chatvista.clientId', generated);
      return generated;
    }

    function saveProfilePreference() {
      try {
        const snapshot = {
          username: usernameInput.value || '',
          color: colorPicker.value || '#2563eb',
          avatarImage: avatarPhotoDataUrl || ''
        };
        window.localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(snapshot));
      } catch {}
    }

    function loadProfilePreference() {
      try {
        const raw = window.localStorage.getItem(PROFILE_STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);

        if (saved && typeof saved.username === 'string' && saved.username.trim()) {
          usernameInput.value = saved.username;
        }

        if (saved && typeof saved.color === 'string') {
          colorPicker.value = saved.color;
        }

        if (saved && typeof saved.avatarImage === 'string' && saved.avatarImage.startsWith('data:image/')) {
          avatarPhotoDataUrl = saved.avatarImage;
        }
      } catch {}
    }

    function normalizeMessage(payload) {
      return {
        id: payload.id || payload.created_at || payload.createdAt || payload.audio_url || payload.text,
        userId: payload.user_id || payload.userId || '',
        username: payload.username || 'Anônimo',
        emoji: payload.emoji || DEFAULT_AVATAR_SYMBOL,
        avatarType: payload.avatar_type || payload.avatarType || 'emoji',
        avatarImage: payload.avatar_image || payload.avatarImage || '',
        color: payload.color || '#2563eb',
        type: payload.type,
        text: payload.text,
        audioUrl: payload.audio_url || payload.audioUrl || ''
      };
    }

    function createAvatarBadge(avatarType, avatarImage, emoji) {
      const badge = document.createElement('span');
      badge.className = 'avatar-badge';

      if (avatarType === 'photo' && avatarImage) {
        const img = document.createElement('img');
        img.src = avatarImage;
        img.alt = 'avatar';
        badge.appendChild(img);
      } else {
        badge.textContent = emoji || DEFAULT_AVATAR_SYMBOL;
      }

      return badge;
    }

    function buildUsernameTag(message) {
      const usernameTag = document.createElement('span');
      usernameTag.className = 'username';

      const avatar = createAvatarBadge(message.avatarType, message.avatarImage, message.emoji);
      const nameLabel = document.createElement('span');
      nameLabel.className = 'username-label';
      nameLabel.style.color = message.color;
      nameLabel.textContent = `${message.username}:`;

      usernameTag.appendChild(avatar);
      usernameTag.appendChild(nameLabel);

      usernameTag.dataset.userId = message.userId || '';
      usernameTag.dataset.username = message.username || 'Anônimo';
      usernameTag.dataset.emoji = message.emoji || DEFAULT_AVATAR_SYMBOL;
      usernameTag.dataset.avatarType = message.avatarType || 'emoji';
      usernameTag.dataset.avatarImage = message.avatarImage || '';
      usernameTag.dataset.color = message.color || '#2563eb';
      usernameTag.title = 'Clique para abrir conversa privada';
      return usernameTag;
    }

    function refreshAvatarPreview() {
      if (!avatarPreview) return;
      avatarPreview.innerHTML = '';
      avatarPreview.appendChild(createAvatarBadge(avatarPhotoDataUrl ? 'photo' : 'emoji', avatarPhotoDataUrl, DEFAULT_AVATAR_SYMBOL));
    }

    function renderTextMessage(payload) {
      const msgElem = document.createElement('div');
      msgElem.className = 'message';
      msgElem.appendChild(buildUsernameTag(payload));
      msgElem.append(` ${payload.text}`);
      messagesDiv.appendChild(msgElem);
    }

    function renderAudioMessage(payload) {
      const msgElem = document.createElement('div');
      msgElem.className = 'audio-message';
      msgElem.appendChild(buildUsernameTag(payload));

      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = payload.audioUrl;
      audio.style.verticalAlign = 'middle';

      msgElem.appendChild(audio);
      messagesDiv.appendChild(msgElem);
    }

    function renderIncomingMessage(messageKey, payload) {
      if (renderedMessageKeys.has(messageKey)) return;
      renderedMessageKeys.add(messageKey);

      const message = normalizeMessage(payload);

      if (message.type === 'audio' && message.audioUrl) {
        renderAudioMessage(message);
      } else if (message.type === 'text' && message.text) {
        renderTextMessage(message);
      }

      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function getCurrentProfile() {
      const resolvedAvatarType = avatarPhotoDataUrl ? 'photo' : 'emoji';
      return {
        username: usernameInput.value.trim() || 'Anônimo',
        emoji: DEFAULT_AVATAR_SYMBOL,
        avatarType: resolvedAvatarType,
        avatarImage: resolvedAvatarType === 'photo' ? avatarPhotoDataUrl : '',
        color: colorPicker.value
      };
    }

    function updateAvatarInputState() {
      avatarPhotoInput.disabled = messageInput.disabled;
      refreshAvatarPreview();
    }

    async function buildAvatarDataUrl(file) {
      return new Promise(function (resolve, reject) {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = function () {
          const size = 96;
          const side = Math.min(img.naturalWidth, img.naturalHeight);
          const sx = (img.naturalWidth - side) / 2;
          const sy = (img.naturalHeight - side) / 2;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Sem contexto de imagem'));
            return;
          }

          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          URL.revokeObjectURL(objectUrl);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };

        img.onerror = function () {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Falha ao processar imagem'));
        };

        img.src = objectUrl;
      });
    }

    function lockUsernameChoice() {
      if (usernameLocked) return;
      usernameLocked = true;
      usernameInput.disabled = true;
      usernameInput.title = 'Nome bloqueado apos a primeira mensagem.';
    }

    function showAdPrompt() {
      const adElem = document.createElement('div');
      adElem.className = 'message';
      adElem.style.background = '#fffbe8';
      adElem.style.border = '1px solid #ffe066';
      adElem.style.borderRadius = '8px';
      adElem.style.padding = '12px';
      adElem.style.margin = '16px 0';
      adElem.style.textAlign = 'center';
      adElem.style.fontWeight = 'bold';

      const textNode = document.createTextNode('🎯 Quer anunciar seu negócio no chat? ');
      const adBtn = document.createElement('button');
      adBtn.type = 'button';
      adBtn.textContent = 'Anunciar';
      adBtn.style.marginLeft = '8px';
      adBtn.style.padding = '6px 14px';
      adBtn.style.borderRadius = '6px';
      adBtn.style.border = 'none';
      adBtn.style.background = '#2563eb';
      adBtn.style.color = '#fff';
      adBtn.style.cursor = 'pointer';

      adBtn.addEventListener('click', function () {
        if (document.getElementById('adModal')) return;

        const modal = document.createElement('div');
        modal.id = 'adModal';
        modal.style.position = 'fixed';
        modal.style.top = '0';
        modal.style.left = '0';
        modal.style.width = '100vw';
        modal.style.height = '100vh';
        modal.style.background = 'rgba(0,0,0,0.35)';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.zIndex = '9999';

        modal.innerHTML = `
          <div style="background:#fff; border-radius:12px; padding:32px 28px; box-shadow:0 8px 32px #0003; min-width:320px; max-width:90vw; font-family:Arial,sans-serif; position:relative;">
            <button id="closeAdModal" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.4em;cursor:pointer;color:#2563eb;" type="button">✖</button>
            <h2 style="margin-top:0;color:#2563eb;font-family:'Permanent Marker',cursive,sans-serif;font-size:1.3em;">Anunciar no Chat</h2>
            <form id="adForm" style="display:flex;flex-direction:column;gap:14px;">
              <input type="text" id="adNome" placeholder="Seu nome" required style="padding:10px;border-radius:6px;border:1px solid #ccc;font-size:1em;">
              <input type="tel" id="adTelefone" placeholder="Telefone" required style="padding:10px;border-radius:6px;border:1px solid #ccc;font-size:1em;">
              <input type="email" id="adEmail" placeholder="E-mail" required style="padding:10px;border-radius:6px;border:1px solid #ccc;font-size:1em;">
              <button type="submit" style="padding:12px 0;border-radius:6px;border:none;background:#2563eb;color:#fff;font-size:1.1em;cursor:pointer;margin-top:8px;">Enviar</button>
            </form>
          </div>
        `;
        document.body.appendChild(modal);

        document.getElementById('closeAdModal').addEventListener('click', () => modal.remove());

        document.getElementById('adForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const nome = document.getElementById('adNome').value.trim();
          const telefone = document.getElementById('adTelefone').value.trim();
          const email = document.getElementById('adEmail').value.trim();

          if (!nome || !telefone || !email) {
            alert('Preencha todos os campos.');
            return;
          }

          if (typeof window.emailjs === 'undefined') {
            alert('Serviço de e-mail indisponível no momento.');
            return;
          }

          window.emailjs.send('service_ec1f9tb', 'template_apgrk0k', { nome, telefone, email }).then(
            function () {
              alert('Dados enviados com sucesso!');
              modal.remove();
            },
            function () {
              alert('Erro ao enviar. Tente novamente.');
            }
          );
        });
      });

      adElem.appendChild(textNode);
      adElem.appendChild(adBtn);
      messagesDiv.appendChild(adElem);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function setInputsDisabled(disabled) {
      usernameInput.disabled = disabled || usernameLocked;
      messageInput.disabled = disabled;
      avatarPhotoInput.disabled = disabled;
      updateAvatarInputState();
      colorPicker.disabled = disabled;
      clearProfileBtn.disabled = disabled;
      audioBtn.disabled = disabled;
      const submitBtn = mainChatForm.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = disabled;
    }

    async function loadInitialMessages() {
      const { data, error } = await supabase
        .from(supabaseConfig.messagesTable)
        .select('*')
        .order('created_at', { ascending: false })
        .limit(200);

      if (error) {
        throw error;
      }

      (data || []).reverse().forEach(function (row) {
        renderIncomingMessage(String(row.id || row.created_at), row);
      });
    }

    function updatePresenceCount() {
      if (!presenceChannel) return;
      const presenceState = presenceChannel.presenceState();
      const onlineCount = Object.keys(presenceState).length;
      onlineCountElem.textContent = String(onlineCount);
      onlineTextElem.textContent = onlineCount === 1 ? 'pessoa online' : 'pessoas online';
    }

    async function trackPresence() {
      if (!presenceChannel) return;
      const profile = getCurrentProfile();
      await presenceChannel.track({
        username: profile.username,
        updatedAt: Date.now()
      });
    }

    function bindPresence() {
      presenceChannel = supabase.channel(`presence:${supabaseConfig.roomName}`, {
        config: {
          presence: {
            key: currentUser.uid
          }
        }
      });

      presenceChannel.on('presence', { event: 'sync' }, updatePresenceCount);
      presenceChannel.subscribe(async function (status) {
        if (status === 'SUBSCRIBED') {
          try {
            await trackPresence();
          } catch {
            onlineCountElem.textContent = '0';
            onlineTextElem.textContent = 'erro de presença';
          }
        }
      });
    }

    function bindMessageRealtime() {
      messagesChannel = supabase
        .channel(`messages:${supabaseConfig.roomName}`)
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: supabaseConfig.messagesTable
          },
          function (payload) {
            if (!payload || !payload.new) return;
            renderIncomingMessage(String(payload.new.id || payload.new.created_at), payload.new);
          }
        )
        .subscribe();
    }

    function bindBroadcastRealtime() {
      messagesChannel = supabase
        .channel(`broadcast:${supabaseConfig.roomName}`)
        .on('broadcast', { event: 'message' }, function (payload) {
          if (!payload || !payload.payload) return;
          const incoming = payload.payload;
          const key = String(incoming.id || incoming.created_at || `${incoming.user_id}-${incoming.text}-${Date.now()}`);
          renderIncomingMessage(key, incoming);
        })
        .subscribe();
    }

    function formatSupabaseError(error) {
      if (!error) return 'erro desconhecido';
      const parts = [];
      if (error.code) parts.push(`code=${error.code}`);
      if (error.message) parts.push(error.message);
      if (error.details) parts.push(error.details);
      if (error.hint) parts.push(`hint=${error.hint}`);
      if (parts.length === 0) return String(error);
      return parts.join(' | ');
    }

    async function cleanupAllMessages(options) {
      if (!supabaseConfig || !supabaseConfig.url || !supabaseConfig.anonKey) return;
      const keepalive = Boolean(options && options.keepalive);
      const endpoint = `${supabaseConfig.url}/rest/v1/${supabaseConfig.messagesTable}?id=gt.0`;
      try {
        await fetch(endpoint, {
          method: 'DELETE',
          headers: {
            apikey: supabaseConfig.anonKey,
            Authorization: `Bearer ${supabaseConfig.anonKey}`
          },
          keepalive
        });
      } catch {
        // Ignora erro para nao bloquear inicializacao/fechamento da pagina.
      }
    }

    function resolveUserIdByUsername(username) {
      if (!presenceChannel || !username || !currentUser) return '';
      const state = presenceChannel.presenceState();
      const entries = Object.entries(state || {});

      for (const [userId, metas] of entries) {
        if (userId === currentUser.uid) continue;
        const list = Array.isArray(metas)
          ? metas
          : (metas && Array.isArray(metas.metas) ? metas.metas : []);
        const matched = list.some(function (meta) {
          return (meta && (meta.username || 'Anônimo')) === username;
        });
        if (matched) return userId;
      }

      return '';
    }

    function getConversationKey(userA, userB) {
      return [String(userA), String(userB)].sort().join('::');
    }

    function appendPrivateMessage(message) {
      if (!privateMessagesElem || !currentUser) return;
      const msgElem = document.createElement('div');
      const isMine = message.from_user_id === currentUser.uid;
      msgElem.className = `private-msg ${isMine ? 'mine' : ''}`;

      const avatar = createAvatarBadge(
        message.from_avatar_type || 'emoji',
        message.from_avatar_image || '',
        message.from_emoji || DEFAULT_AVATAR_SYMBOL
      );
      const name = document.createElement('strong');
      name.style.marginRight = '4px';
      name.textContent = `${message.from_username || 'Anônimo'}:`;
      const text = document.createElement('span');
      text.textContent = ` ${message.text || ''}`;

      msgElem.appendChild(avatar);
      msgElem.appendChild(name);
      msgElem.appendChild(text);
      privateMessagesElem.appendChild(msgElem);
      privateMessagesElem.scrollTop = privateMessagesElem.scrollHeight;
    }

    function showPrivateSystemMessage(text) {
      if (!privateMessagesElem) return;
      const msgElem = document.createElement('div');
      msgElem.className = 'private-msg system';
      msgElem.textContent = text;
      privateMessagesElem.appendChild(msgElem);
      privateMessagesElem.scrollTop = privateMessagesElem.scrollHeight;
    }

    function renderPrivateConversation() {
      if (!privateMessagesElem || !activePrivateTarget || !currentUser) return;
      privateMessagesElem.innerHTML = '';
      const key = getConversationKey(currentUser.uid, activePrivateTarget.userId);
      const conversation = privateConversations.get(key) || [];
      if (conversation.length === 0) {
        showPrivateSystemMessage(`Conversa privada com ${activePrivateTarget.username}.`);
        return;
      }
      conversation.forEach(appendPrivateMessage);
    }

    function storePrivateMessage(message) {
      const key = getConversationKey(message.from_user_id, message.to_user_id);
      if (!privateConversations.has(key)) {
        privateConversations.set(key, []);
      }
      const list = privateConversations.get(key);
      list.push(message);
      if (list.length > 120) {
        list.shift();
      }

      if (
        activePrivateTarget &&
        currentUser &&
        key === getConversationKey(currentUser.uid, activePrivateTarget.userId)
      ) {
        if (!privateMessagesElem || privateMessagesElem.children.length === 0) {
          renderPrivateConversation();
        } else {
          appendPrivateMessage(message);
        }
      }
    }

    function getPrivateOutChannel(targetUserId) {
      if (privateOutChannels.has(targetUserId)) {
        return privateOutChannels.get(targetUserId);
      }

      const channel = supabase.channel(`private-inbox:${supabaseConfig.roomName}:${targetUserId}`);
      channel.subscribe();
      privateOutChannels.set(targetUserId, channel);
      return channel;
    }

    async function sendPrivateMessage() {
      if (!activePrivateTarget || !privateInputElem || !currentUser) return;
      if (!activePrivateTarget.userId || activePrivateTarget.userId === currentUser.uid) return;

      const text = privateInputElem.value.trim();
      if (!text) return;

      const profile = getCurrentProfile();
      const payload = {
        id: `pm-${currentUser.uid}-${Date.now()}`,
        from_user_id: currentUser.uid,
        from_username: profile.username,
        from_emoji: profile.emoji,
        from_avatar_type: profile.avatarType,
        from_avatar_image: profile.avatarImage,
        from_color: profile.color,
        to_user_id: activePrivateTarget.userId,
        to_username: activePrivateTarget.username,
        text,
        created_at: new Date().toISOString()
      };

      try {
        const outChannel = getPrivateOutChannel(activePrivateTarget.userId);
        await outChannel.send({ type: 'broadcast', event: 'private-message', payload });
        storePrivateMessage(payload);
        privateInputElem.value = '';
        privateInputElem.focus();
      } catch {
        alert('Não foi possível enviar a mensagem privada.');
      }
    }

    function ensurePrivateChatWindow() {
      if (privateChatElem) return;

      privateChatElem = document.createElement('div');
      privateChatElem.className = 'private-chat';

      const header = document.createElement('div');
      header.className = 'private-header';

      privateTitleElem = document.createElement('span');
      privateTitleElem.textContent = 'Conversa privada';

      const headerButtons = document.createElement('div');
      headerButtons.className = 'header-btns';

      const minBtn = document.createElement('button');
      minBtn.type = 'button';
      minBtn.title = 'Minimizar';
      minBtn.textContent = '−';
      minBtn.addEventListener('click', function () {
        privateChatElem.classList.toggle('minimized');
      });

      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.title = 'Fechar';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', function () {
        privateChatElem.remove();
        privateChatElem = null;
        privateTitleElem = null;
        privateMessagesElem = null;
        privateInputElem = null;
        privateSendBtn = null;
        activePrivateTarget = null;
      });

      headerButtons.appendChild(minBtn);
      headerButtons.appendChild(closeBtn);
      header.appendChild(privateTitleElem);
      header.appendChild(headerButtons);

      privateMessagesElem = document.createElement('div');
      privateMessagesElem.className = 'private-messages';

      const form = document.createElement('form');
      form.className = 'private-input-area';
      form.autocomplete = 'off';

      privateInputElem = document.createElement('input');
      privateInputElem.type = 'text';
      privateInputElem.placeholder = 'Digite uma mensagem privada...';
      privateInputElem.maxLength = 250;

      const sendBtn = document.createElement('button');
      sendBtn.type = 'submit';
      sendBtn.textContent = 'Enviar';
      privateSendBtn = sendBtn;

      form.appendChild(privateInputElem);
      form.appendChild(sendBtn);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        await sendPrivateMessage();
      });

      privateChatElem.appendChild(header);
      privateChatElem.appendChild(privateMessagesElem);
      privateChatElem.appendChild(form);
      document.body.appendChild(privateChatElem);
    }

    function openPrivateChat(target) {
      if (!canUseRealtime || !currentUser || !target) return;

      ensurePrivateChatWindow();
      if (!privateChatElem || !privateTitleElem || !privateInputElem || !privateSendBtn) return;

      privateChatElem.classList.remove('minimized');
      activePrivateTarget = {
        userId: target.userId || '',
        username: target.username || 'Anônimo',
        color: target.color || '#2563eb'
      };
      privateTitleElem.textContent = `Privado com ${target.username}`;
      renderPrivateConversation();

      const canSend = Boolean(activePrivateTarget.userId) && activePrivateTarget.userId !== currentUser.uid;
      privateInputElem.disabled = !canSend;
      privateSendBtn.disabled = !canSend;

      if (!canSend) {
        privateMessagesElem.innerHTML = '';
        if (activePrivateTarget.userId === currentUser.uid) {
          showPrivateSystemMessage('Este nickname e o seu. Clique em outro usuario para conversar em privado.');
        } else {
          showPrivateSystemMessage('Nao foi possivel identificar este usuario para conversa privada ainda.');
        }
      }

      privateInputElem.focus();
    }

    function bindPrivateInbox() {
      if (!supabase || !currentUser || privateInboxChannel) return;

      privateInboxChannel = supabase
        .channel(`private-inbox:${supabaseConfig.roomName}:${currentUser.uid}`)
        .on('broadcast', { event: 'private-message' }, function ({ payload }) {
          if (!payload || payload.to_user_id !== currentUser.uid) return;
          storePrivateMessage(payload);
        })
        .subscribe();
    }

    messagesDiv.addEventListener('click', function (e) {
      const targetElem = e.target.closest('.username');
      if (!targetElem || !messagesDiv.contains(targetElem)) return;
      if (!canUseRealtime || !currentUser) return;

      let targetUserId = targetElem.dataset.userId || '';
      const targetUsername = targetElem.dataset.username || 'Anônimo';
      const targetColor = targetElem.dataset.color || '#2563eb';

      if (!targetUserId || targetUserId === currentUser.uid) {
        const resolved = resolveUserIdByUsername(targetUsername);
        if (resolved) targetUserId = resolved;
      }

      openPrivateChat({
        userId: targetUserId,
        username: targetUsername,
        color: targetColor
      });
    });

    mainChatForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!canUseRealtime || !currentUser) return;

      const profile = getCurrentProfile();
      const { username, emoji, color, avatarType, avatarImage } = profile;
      const text = messageInput.value.trim();
      if (!text) return;

      try {
        if (useBroadcastFallback) {
          const payload = {
            id: `${currentUser.uid}-${Date.now()}`,
            user_id: currentUser.uid,
            username,
            emoji,
            avatar_type: avatarType,
            avatar_image: avatarImage,
            color,
            type: 'text',
            text,
            created_at: new Date().toISOString()
          };
          await messagesChannel.send({ type: 'broadcast', event: 'message', payload });
          renderIncomingMessage(String(payload.id), payload);
        } else {
          await supabase.from(supabaseConfig.messagesTable).insert({
            user_id: currentUser.uid,
            username,
            emoji,
            avatar_type: avatarType,
            avatar_image: avatarImage,
            color,
            type: 'text',
            text,
            created_at: new Date().toISOString()
          });
        }

        lockUsernameChoice();
        messageInput.value = '';
        messageInput.focus();

        mainMessageCount++;
        if (mainMessageCount % 10 === 0) {
          showAdPrompt();
        }
      } catch {
        alert('Não foi possível enviar a mensagem.');
      }
    });

    usernameInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        messageInput.focus();
      }
    });

    usernameInput.addEventListener('change', saveProfilePreference);
    colorPicker.addEventListener('change', saveProfilePreference);

    usernameInput.addEventListener('input', function () {
      saveProfilePreference();
      if (!presenceChannel || !currentUser) return;
      trackPresence().catch(function () {});
    });

    avatarPhotoInput.addEventListener('change', async function () {
      const file = avatarPhotoInput.files && avatarPhotoInput.files[0];
      if (!file) {
        avatarPhotoDataUrl = '';
        refreshAvatarPreview();
        saveProfilePreference();
        return;
      }

      if (!file.type.startsWith('image/')) {
        alert('Escolha um arquivo de imagem válido para o avatar.');
        avatarPhotoInput.value = '';
        avatarPhotoDataUrl = '';
        refreshAvatarPreview();
        saveProfilePreference();
        return;
      }

      try {
        avatarPhotoDataUrl = await buildAvatarDataUrl(file);
        refreshAvatarPreview();
        saveProfilePreference();
      } catch {
        alert('Não foi possível processar a foto do avatar.');
        avatarPhotoInput.value = '';
        avatarPhotoDataUrl = '';
        refreshAvatarPreview();
        saveProfilePreference();
      }
    });

    clearProfileBtn.addEventListener('click', function () {
      usernameInput.value = '';
      colorPicker.value = '#2563eb';
      avatarPhotoInput.value = '';
      avatarPhotoDataUrl = '';
      saveProfilePreference();
      refreshAvatarPreview();
      if (usernameLocked) {
        usernameInput.disabled = true;
      }
    });

    audioBtn.addEventListener('click', async function () {
      if (!canUseRealtime || !currentUser) return;
      if (useBroadcastFallback) {
        alert('Áudio indisponível no modo simplificado. Configure tabela e bucket no Supabase para ativar.');
        return;
      }

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = function (e) {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async function () {
          const profile = getCurrentProfile();
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

          try {
            const path = `${currentUser.uid}/${Date.now()}.webm`;
            const bucket = supabase.storage.from(supabaseConfig.audioBucket);

            const { error: uploadError } = await bucket.upload(path, audioBlob, {
              contentType: 'audio/webm',
              upsert: false
            });
            if (uploadError) throw uploadError;

            const { data: publicUrlData } = bucket.getPublicUrl(path);
            const audioUrl = publicUrlData && publicUrlData.publicUrl;
            if (!audioUrl) throw new Error('Sem URL pública para áudio');

            await supabase.from(supabaseConfig.messagesTable).insert({
              user_id: currentUser.uid,
              username: profile.username,
              emoji: profile.emoji,
              avatar_type: profile.avatarType,
              avatar_image: profile.avatarImage,
              color: profile.color,
              type: 'audio',
              audio_url: audioUrl,
              created_at: new Date().toISOString()
            });

            lockUsernameChoice();
          } catch {
            alert('Não foi possível enviar o áudio.');
          }
        };

        mediaRecorder.start();
        recordingStatus.hidden = false;
        audioBtn.textContent = '⏹️ Parar';

        audioTimeout = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            stopRecording();
          }
        }, 10000);
      } catch {
        alert('Permissão do microfone negada ou não suportada.');
      }
    });

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recordingStatus.hidden = true;
        audioBtn.textContent = '🎤 Áudio';
        clearTimeout(audioTimeout);
      }
    }

    async function initRealtime() {
      if (!isSupabaseConfigured()) {
        setInputsDisabled(true);
        onlineCountElem.textContent = '0';
        onlineTextElem.textContent = 'configure o Supabase';
        const aviso = document.createElement('div');
        aviso.className = 'message';
        aviso.textContent = 'Configure as credenciais do Supabase em firebase-config.js para ativar o chat em tempo real.';
        messagesDiv.appendChild(aviso);
        return;
      }

      try {
        supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
        currentUser = { uid: getOrCreateClientId() };
        canUseRealtime = true;
        bindPrivateInbox();

        await cleanupAllMessages();

        if (FORCE_BROADCAST_MODE) {
          useBroadcastFallback = true;
          bindPresence();
          bindBroadcastRealtime();
          setInputsDisabled(false);
          const avisoFallback = document.createElement('div');
          avisoFallback.className = 'message';
          avisoFallback.textContent = 'Chat em modo simplificado: mensagens em tempo real ativas. Configure tabela/bucket no Supabase para histórico e áudio.';
          messagesDiv.appendChild(avisoFallback);
          return;
        }

        try {
          if (ENABLE_MESSAGE_HISTORY) {
            await loadInitialMessages();
          } else {
            messagesDiv.innerHTML = '';
          }
          bindPresence();
          bindMessageRealtime();
        } catch (loadError) {
          useBroadcastFallback = true;
          bindPresence();
          bindBroadcastRealtime();
          setInputsDisabled(false);
          const avisoFallback = document.createElement('div');
          avisoFallback.className = 'message';
          const errorText = formatSupabaseError(loadError);
          console.warn('Fallback ativado no chat:', loadError);
          avisoFallback.textContent = `Chat em modo simplificado: mensagens em tempo real ativas. Motivo: ${errorText}. Configure tabela/bucket no Supabase para histórico e áudio.`;
          messagesDiv.appendChild(avisoFallback);
        }
      } catch {
        setInputsDisabled(true);
        const aviso = document.createElement('div');
        aviso.className = 'message';
        aviso.textContent = 'Falha ao conectar ao Supabase. Verifique tabela, bucket e configurações.';
        messagesDiv.appendChild(aviso);
      }
    }

    window.addEventListener('beforeunload', function () {
      cleanupAllMessages({ keepalive: true });
      if (presenceChannel) {
        presenceChannel.unsubscribe();
      }
      if (messagesChannel) {
        messagesChannel.unsubscribe();
      }
      if (privateInboxChannel) {
        privateInboxChannel.unsubscribe();
      }
      privateOutChannels.forEach(function (channel) {
        channel.unsubscribe();
      });
    });

    loadProfilePreference();

    if (!isSupabaseConfigured()) {
      setInputsDisabled(true);
      onlineCountElem.textContent = '0';
      onlineTextElem.textContent = 'configure o Supabase';
      const aviso = document.createElement('div');
      aviso.className = 'message';
      aviso.textContent = 'Configure as credenciais do Supabase em firebase-config.js para ativar o chat em tempo real.';
      messagesDiv.appendChild(aviso);
    } else {
      initRealtime();
    }

    updateAvatarInputState();

  </script>
