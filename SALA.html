    function openPrivateChat(target) {
      if (!canUseRealtime || !currentUser || !target) return;

      ensurePrivateChatWindow();
      if (!privateChatElem || !privateTitleElem || !privateInputElem || !privateSendBtn) return;

      privateChatElem.classList.remove('minimized');
      activePrivateTarget = {
        userId: target.userId || '',
        username: target.username || 'Anônimo',
        color: target.color || '#2563eb',
        usernameKey: normalizeUsernameKey(target.username || ''),
        conversationId: resolvePrivatePartyId(target.userId || '', target.username || '')
      };
      privateTitleElem.textContent = `Privado com ${target.username}`;
      stopPrivateTitleFlash();
      setPrivateUnreadState(false);

      const selfKey = normalizeUsernameKey(getCurrentProfile().username);
      const sameUserById = Boolean(activePrivateTarget.userId) && activePrivateTarget.userId === currentUser.uid;
      const sameUserByName = Boolean(activePrivateTarget.usernameKey) && activePrivateTarget.usernameKey === selfKey;
      const canSend = !sameUserById && !sameUserByName && Boolean(activePrivateTarget.usernameKey || activePrivateTarget.userId);
      privateInputElem.disabled = !canSend;
      privateSendBtn.disabled = !canSend;
      renderPrivateConversation();

      if (!canSend) {
        privateMessagesElem.innerHTML = '';
        if (activePrivateTarget.userId === currentUser.uid) {
          showPrivateSystemMessage('Este nickname e o seu. Clique em outro usuario para conversar em privado.');
        } else {
          showPrivateSystemMessage('Nao foi possivel identificar este usuario para conversa privada ainda.');
        }
      }

      privateInputElem.focus();
    }

    function bindPrivateInbox() {
      if (!supabase || !currentUser || privateInboxChannel) return;

      privateInboxChannel = supabase
        .channel(`private-inbox:${supabaseConfig.roomName}:${currentUser.uid}`)
        .on('broadcast', { event: 'private-message' }, function ({ payload }) {
          if (!payload) return;
          const selfNameKey = normalizeUsernameKey(getCurrentProfile().username);
          const toNameKey = normalizeUsernameKey(payload.to_username_key || payload.to_username);
          const matchesUser = payload.to_user_id === currentUser.uid;
          const matchesName = Boolean(selfNameKey) && toNameKey === selfNameKey;
          const isMine = payload.from_user_id === currentUser.uid;
          if (!matchesUser && !matchesName && !isMine) return;
          storePrivateMessage(payload);
        })
        .subscribe();
    }

    async function sendFileMessage(file) {
      if (!file || !supabase || !currentUser || !canUseRealtime) return;

      try {
        const profile = getCurrentProfile();
        const safeName = buildSafeFileName(file.name || 'arquivo');
        const filePath = `${currentUser.uid}/files/${Date.now()}-${safeName}`;
        const bucket = supabase.storage.from(supabaseConfig.audioBucket);

        const { error: uploadError } = await bucket.upload(filePath, file, {
          contentType: file.type || 'application/octet-stream',
          upsert: false
        });
        if (uploadError) throw uploadError;

        const { data: publicUrlData } = bucket.getPublicUrl(filePath);
        const fileUrl = publicUrlData && publicUrlData.publicUrl;
        if (!fileUrl) throw new Error('Sem URL pública para arquivo');

        const fileMeta = {
          name: file.name || safeName,
          url: fileUrl,
          mime: file.type || '',
          size: typeof file.size === 'number' ? file.size : 0
        };

        // Se escolheu foto e upload ainda em andamento, esperar terminar
        let finalAvatarImage = profile.avatarImage;
        if (profile.avatarType === 'photo' && avatarPhotoDataUrl && !avatarPhotoUrl) {
          console.log('[DEBUG] Arquivo: Foto selecionada, aguardando upload de avatar...');
          
          // Aguardar upload completar (max 10 segundos)
          let uploadCompleted = false;
          for (let i = 0; i < 100 && !uploadCompleted; i++) {
            if (avatarPhotoUrl) {
              uploadCompleted = true;
              console.log('[DEBUG] Arquivo: Upload de avatar completou!');
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 100)); // Esperar 100ms
          }
          
          if (!uploadCompleted || !avatarPhotoUrl) {
            // Upload falhou ou demorou demais - NÃO enviar com data URL!
            console.error('[DEBUG] Arquivo: Upload de foto falhou ou timeout. Recusando enviar mensagem.');
            alert('⚠️ Erro: A foto do avatar não conseguiu fazer upload.\n\nPor favor:\n1. Tente selecionar a foto novamente\n2. Ou use emoji como avatar\n3. Depois compartilhe o arquivo');
            return; // Não enviar mensagem
          }
          
          finalAvatarImage = avatarPhotoUrl; // Usar APENAS URL pública
        }

        const payload = {
          user_id: currentUser.uid,
          username: profile.username,
          emoji: profile.emoji,
          avatar_type: profile.avatarType,
          avatar_image: finalAvatarImage,
          color: profile.color,
          type: 'text',
          text: createFileMessageText(fileMeta),
          created_at: new Date().toISOString(),
          id: `${currentUser.uid}-file-${Date.now()}`
        };

        let delivered = false;
        if (broadcastChannel && broadcastReady) {
          await broadcastChannel.send({ type: 'broadcast', event: 'message', payload });
          delivered = true;
        }

        // Salvar no banco: avatar_image agora é URL pública (upload para bucket)
        // Arquivo mensagens salvam foto do avatar com persistência
        const dbFilePayload = {
          id: payload.id,
          user_id: payload.user_id,
          username: payload.username,
          emoji: payload.emoji,
          avatar_type: payload.avatar_type,
          avatar_image: payload.avatar_image,
          color: payload.color,
          type: payload.type,
          text: payload.text
        };

        if (supabase) {
          const { error: insertError } = await supabase.from(supabaseConfig.messagesTable).insert(dbFilePayload);
          if (!insertError) {
            delivered = true;
            dbReady = true;
          } else {
            console.warn('[DEBUG] Insert arquivo no banco falhou:', formatSupabaseError(insertError));
          }
        }

        if (!delivered) {
          throw new Error('Sem rota de envio para arquivo');
        }

        renderIncomingMessage(buildMessageKey(payload), payload);
        lockUsernameChoice();
        mainMessageCount++;
        if (mainMessageCount % 10 === 0) {
          showAdPrompt();
        }
      } catch {
        alert('Não foi possível enviar o arquivo.');
      } finally {
        if (mainFileInput) {
          mainFileInput.value = '';
        }
      }
    }

    messagesDiv.addEventListener('click', function (e) {
      const targetElem = e.target.closest('.username');
      if (!targetElem || !messagesDiv.contains(targetElem)) return;
      if (!canUseRealtime || !currentUser) return;

      let targetUserId = targetElem.dataset.userId || '';
      const targetUsername = targetElem.dataset.username || 'Anônimo';
      const targetColor = targetElem.dataset.color || '#2563eb';

      if (!targetUserId || targetUserId === currentUser.uid) {
        const resolved = resolveUserIdByUsername(targetUsername);
        if (resolved) targetUserId = resolved;
      }

      openPrivateChat({
        userId: targetUserId,
        username: targetUsername,
        color: targetColor
      });
    });

    mainChatForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!canUseRealtime || !currentUser) return;
      const profile = getCurrentProfile();
      const { username, emoji, color, avatarType, avatarImage } = profile;
      const text = messageInput.value.trim();
      if (!text) return;
      setMainSendBusy(true, 'Enviando sua mensagem...');
      
      // CRÍTICO: Se escolheu foto, DEVE aguardar até que upload complete
      let finalAvatarImage = avatarImage;
      if (avatarType === 'photo' && avatarPhotoDataUrl && !avatarPhotoUrl) {
        console.log('[DEBUG] Foto selecionada, aguardando upload de avatar...');
        
        // Aguardar upload completar (max 10 segundos)
        let uploadCompleted = false;
        for (let i = 0; i < 100 && !uploadCompleted; i++) {
          if (avatarPhotoUrl) {
            uploadCompleted = true;
            console.log('[DEBUG] Upload de avatar completou!');
            break;
          }
          await new Promise(resolve => setTimeout(resolve, 100)); // Esperar 100ms
        }
        
        if (!uploadCompleted || !avatarPhotoUrl) {
          // Upload falhou ou demorou demais - NÃO enviar com data URL!
          console.error('[DEBUG] Upload de foto falhou ou timeout. Recusando enviar mensagem.');
          alert('⚠️ Erro: A foto do avatar não conseguiu fazer upload.\n\nPor favor:\n1. Tente selecionar a foto novamente\n2. Ou use emoji como avatar\n3. Depois envie a mensagem');
          return; // Não enviar mensagem
        }
        
        finalAvatarImage = avatarPhotoUrl; // Usar APENAS URL pública (nunca data URL)
      }
      
      const payload = {
        user_id: currentUser.uid,
        username,
        emoji,
        avatar_type: avatarType,
        avatar_image: finalAvatarImage,
        color,
        type: 'text',
        text,
        created_at: new Date().toISOString()
      };
      try {
        payload.id = `${currentUser.uid}-${Date.now()}`;

        // Salvar no banco: avatar_image agora é URL pública (upload para bucket)
        // NUNCA salvar data URL diretamente no banco!
        const dbPayload = {
          id: payload.id,
          user_id: payload.user_id,
          username: payload.username,
          emoji: payload.emoji,
          avatar_type: payload.avatar_type,
          avatar_image: payload.avatar_image || '', // Usar URL ou string vazia
          color: payload.color,
          type: payload.type,
          text: payload.text
        };

        // SEMPRE tentar salvar no banco primeiro
        let savedToDb = false;
        if (supabase) {
          const { error: insertError } = await supabase.from(supabaseConfig.messagesTable).insert(dbPayload);
          if (!insertError) {
            savedToDb = true;
            dbReady = true;
            console.log('[DEBUG] Mensagem salva no banco com sucesso');
          } else {
            console.error('[DEBUG] Erro ao salvar:', insertError);
          }
        }

        // Enviar via broadcast tambem (com TODOS os campos para renderização com avatar photo)
        if (broadcastChannel && broadcastReady) {
          await broadcastChannel.send({ type: 'broadcast', event: 'message', payload });
          console.log('[DEBUG] Mensagem enviada via broadcast');
        }

        // Se nao salvou em lugar nenhum, nao renderizar
        if (!savedToDb && (!broadcastChannel || !broadcastReady)) {
          throw new Error('Falha ao salvar mensagem');
        }

        renderIncomingMessage(buildMessageKey(payload), payload);
        lockUsernameChoice();
        messageInput.value = '';
        updateMessageCounter();
        autoResizeMessageInput();
        clearFailedMainDraft();
        stopTypingBroadcast();
        messageInput.focus();
        mainMessageCount++;
        if (mainMessageCount % 10 === 0) {
          showAdPrompt();
        }
      } catch (error) {
        console.error('[DEBUG] Erro ao enviar mensagem:', error);
        setFailedMainDraft(text);
        alert('Não foi possível enviar a mensagem.');
      } finally {
        setMainSendBusy(false);
      }
    });

    if (retrySendBtn) {
      retrySendBtn.addEventListener('click', function () {
        if (!failedMainDraft || !failedMainDraft.text) return;
        if (messageInput) {
          messageInput.value = failedMainDraft.text;
          updateMessageCounter();
          autoResizeMessageInput();
          messageInput.focus();
        }
        retrySendBtn.disabled = true;
        mainChatForm.requestSubmit();
      });
    }

      // Scroll inteligente: detectar se usuário scrollou para cima (pausa auto-scroll)
      messagesDiv.addEventListener('scroll', function () {
        const distFromBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight;
        userScrolledUp = distFromBottom > 80;
        if (!userScrolledUp) {
          pendingNewMessages = 0;
        }
        updateNewMessagesBadge();
      });

      if (newMessagesBtn) {
        newMessagesBtn.addEventListener('click', function () {
          scrollMessagesToLatest();
        });
      }

    usernameInput.addEventListener('change', saveProfilePreference);
    colorPicker.addEventListener('change', saveProfilePreference);

    usernameInput.addEventListener('input', function () {
      saveProfilePreference();
      if (!presenceChannel || !currentUser) return;
      trackPresence().catch(function () {});
    });

    messageInput.addEventListener('input', function () {
      autoResizeMessageInput();
      updateMessageCounter();
      scheduleTypingBroadcast();
    });

    messageInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        mainChatForm.requestSubmit();
      }
    });

    messageInput.addEventListener('blur', function () {
      stopTypingBroadcast();
    });

    avatarPhotoInput.addEventListener('change', async function () {
      const file = avatarPhotoInput.files && avatarPhotoInput.files[0];
      if (!file) {
        avatarPhotoDataUrl = '';
        avatarPhotoUrl = '';
        refreshAvatarPreview();
        saveProfilePreference();
        return;
      }

      if (!file.type.startsWith('image/')) {
        alert('Escolha um arquivo de imagem válido para o avatar.');
        avatarPhotoInput.value = '';
        avatarPhotoDataUrl = '';
        avatarPhotoUrl = '';
        refreshAvatarPreview();
        saveProfilePreference();
        return;
      }

      try {
        avatarPhotoDataUrl = await buildAvatarDataUrl(file);
        refreshAvatarPreview();
        saveProfilePreference();
        
        // Fazer upload em background para obter URL pública persistente
        if (supabase && currentUser) {
          uploadAvatarToStorage(avatarPhotoDataUrl).then(function (publicUrl) {
            avatarPhotoUrl = publicUrl;
            console.log('[DEBUG] Avatar URL pública guardada para persistência');
          }).catch(function (error) {
            console.error('[DEBUG] Erro ao fazer upload de avatar:', error);
            avatarPhotoUrl = avatarPhotoDataUrl; // Fallback para data URL
          });
        } else {
          avatarPhotoUrl = avatarPhotoDataUrl; // Fallback se Supabase não disponível
        }
      } catch {
        alert('Não foi possível processar a foto do avatar.');
        avatarPhotoInput.value = '';
        avatarPhotoDataUrl = '';
        avatarPhotoUrl = '';
        refreshAvatarPreview();
        saveProfilePreference();
      }
    });

    avatarPreview.addEventListener('click', function () {
      triggerAvatarFilePicker();
    });

    avatarPreview.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerAvatarFilePicker();
      }
    });

    if (fileBtn) {
      fileBtn.addEventListener('click', function () {
        if (!mainFileInput || mainFileInput.disabled) return;
        mainFileInput.click();
      });
    }

    mainFileInput.addEventListener('change', async function () {
      const file = mainFileInput.files && mainFileInput.files[0];
      if (!file) return;
      await sendFileMessage(file);
    });

    if (clearProfileBtn) {
      clearProfileBtn.addEventListener('click', function () {
        usernameInput.value = '';
        colorPicker.value = '#2563eb';
        avatarPhotoInput.value = '';
        avatarPhotoDataUrl = '';
        saveProfilePreference();
        refreshAvatarPreview();
        if (usernameLocked) {
          usernameInput.disabled = true;
        }
      });
    }

    audioBtn.addEventListener('click', async function () {
      if (!canUseRealtime || !currentUser) return;
      if (mediaRecorder && mediaRecorder.state === 'recording') { stopRecording(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = function (e) { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async function () {
          const profile = getCurrentProfile();
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          try {
            const path = `${currentUser.uid}/${Date.now()}.webm`;
            const bucket = supabase.storage.from(supabaseConfig.audioBucket);
            const { error: uploadError } = await bucket.upload(path, audioBlob, {
              contentType: 'audio/webm',
              upsert: false
            });
            if (uploadError) throw uploadError;

            const { data: publicUrlData } = bucket.getPublicUrl(path);
            const audioUrl = publicUrlData && publicUrlData.publicUrl;
            if (!audioUrl) throw new Error('Sem URL pública para áudio');

            // Se escolheu foto e upload ainda em andamento, esperar terminar
            let finalAvatarImage = profile.avatarImage;
            if (profile.avatarType === 'photo' && avatarPhotoDataUrl && !avatarPhotoUrl) {
              console.log('[DEBUG] Áudio: Foto selecionada, aguardando upload de avatar...');
              
              // Aguardar upload completar (max 10 segundos)
              let uploadCompleted = false;
              for (let i = 0; i < 100 && !uploadCompleted; i++) {
                if (avatarPhotoUrl) {
                  uploadCompleted = true;
                  console.log('[DEBUG] Áudio: Upload de avatar completou!');
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 100)); // Esperar 100ms
              }
              
              if (!uploadCompleted || !avatarPhotoUrl) {
                // Upload falhou ou demorou demais - NÃO enviar com data URL!
                console.error('[DEBUG] Áudio: Upload de foto falhou ou timeout. Recusando enviar mensagem.');
                alert('⚠️ Erro: A foto do avatar não conseguiu fazer upload.\n\nPor favor:\n1. Tente selecionar a foto novamente\n2. Ou use emoji como avatar\n3. Depois envie o áudio');
                return; // Não enviar mensagem
              }
              
              finalAvatarImage = avatarPhotoUrl; // Usar APENAS URL pública
            }

            const payload = {
              id: `${currentUser.uid}-audio-${Date.now()}`,
              user_id: currentUser.uid,
              username: profile.username,
              emoji: profile.emoji,
              avatar_type: profile.avatarType,
              avatar_image: finalAvatarImage,
              color: profile.color,
              type: 'audio',
              audio_url: audioUrl,
              created_at: new Date().toISOString()
            };

            // Salvar no banco: avatar_image agora é URL pública (upload para bucket)
            // Avatar photo persiste via URL do bucket
            const dbAudioPayload = {
              id: payload.id,
              user_id: payload.user_id,
              username: payload.username,
              emoji: payload.emoji,
              avatar_type: payload.avatar_type,
              avatar_image: payload.avatar_image,
              color: payload.color,
              type: payload.type,
              audio_url: payload.audio_url
            };

            let delivered = await sendOnBroadcastChannel('message', payload);
            let persisted = false;

            if (supabase) {
              const { error: insertError } = await supabase.from(supabaseConfig.messagesTable).insert(dbAudioPayload);
              if (!insertError) {
                persisted = true;
                dbReady = true;
              } else {
                console.warn('[DEBUG] Insert áudio no banco falhou:', formatSupabaseError(insertError));
              }
            }

            if (!delivered && !persisted) {
              throw new Error('Audio sem rota de entrega disponivel');
            }

            renderIncomingMessage(buildMessageKey(payload), payload);

            lockUsernameChoice();
          } catch {
            alert('Não foi possível enviar o áudio.');
          }
        };
        mediaRecorder.start();
        recordingStatus.hidden = false;
        audioBtn.textContent = '⏹️ Parar';
        audioBtn.classList.add('is-recording');
        audioTimeout = setTimeout(() => { if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(); }, 10000);
      } catch {
        alert('Permissão do microfone negada ou não suportada.');
      }
    });

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        recordingStatus.hidden = true;
        audioBtn.textContent = '🎤 Áudio';
        audioBtn.classList.remove('is-recording');
        clearTimeout(audioTimeout);
      }
    }

    async function initRealtime() {
      if (!isSupabaseConfigured()) {
        setInputsDisabled(true);
        onlineCountElem.textContent = '0';
        onlineTextElem.textContent = 'configure o Supabase';
        setConnectionStatus('Configuração ausente', true);
        updateLiveHeaderLabel(0);
        const aviso = document.createElement('div');
        aviso.className = 'message';
        aviso.textContent = 'Configure as credenciais do Supabase em firebase-config.js para ativar o chat em tempo real.';
        messagesDiv.appendChild(aviso);
        return;
      }

      try {
        supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
        currentUser = await authenticateSupabaseUser();
        bindAuthStateListener();
        canUseRealtime = true;
        
        // Se houver foto de avatar no localStorage, fazer upload automático
        if (avatarPhotoDataUrl && !avatarPhotoUrl) {
          console.log('[DEBUG] Iniciando upload automático de avatar restaurado...');
          avatarUploadInProgress = true;
          avatarUploadPromise = uploadAvatarToStorage(avatarPhotoDataUrl)
            .then(function (publicUrl) {
              avatarPhotoUrl = publicUrl || avatarPhotoDataUrl;
              console.log('[DEBUG] Avatar restaurado e uploadado com sucesso!');
              return publicUrl;
            })
            .catch(function (error) {
              console.error('[DEBUG] Erro ao fazer upload automático de avatar:', error);
              avatarPhotoUrl = ''; // Deixar vazio, vai tentar novamente com data URL se necessário
            })
            .finally(function () {
              avatarUploadInProgress = false;
            });
        }
        
        bindPrivateInbox();
        bindBroadcastRealtime();
        await checkDatabaseAccess();
        // startMessageCleanupScheduler(); // Desabilitado - preservar histórico do dia inteiro

        if (FORCE_BROADCAST_MODE) {
          useBroadcastFallback = true;
          bindPresence();
          startMessagePolling();
          setInputsDisabled(false);
          const avisoFallback = document.createElement('div');
          avisoFallback.className = 'message';
          avisoFallback.textContent = 'Chat em modo simplificado: mensagens em tempo real ativas. Configure tabela/bucket no Supabase para histórico e áudio.';
          messagesDiv.appendChild(avisoFallback);
          return;
        }

        try {
          console.log('[DEBUG] Iniciando carregamento de histórico...');
          await loadInitialMessages();
          console.log('[DEBUG] Histórico carregado com sucesso');
          bindPresence();
          if (dbReady) {
            bindMessageRealtime();
          }
          startMessagePolling();

          if (!dbReady) {
            const avisoDb = document.createElement('div');
            avisoDb.className = 'message';
            avisoDb.textContent = 'Banco indisponível no Supabase. Chat funcionando em modo de compatibilidade.';
            messagesDiv.appendChild(avisoDb);
          }
        } catch (loadError) {
          useBroadcastFallback = true;
          bindPresence();
          startMessagePolling();
          setInputsDisabled(false);
          const avisoFallback = document.createElement('div');
          avisoFallback.className = 'message';
          const errorText = formatSupabaseError(loadError);
          console.warn('Fallback ativado no chat:', loadError);
          avisoFallback.textContent = `Chat em modo simplificado: mensagens em tempo real ativas. Motivo: ${errorText}. Configure tabela/bucket no Supabase para histórico e áudio.`;
          messagesDiv.appendChild(avisoFallback);
        }
      } catch (authError) {
        setInputsDisabled(true);
        const aviso = document.createElement('div');
        aviso.className = 'message';
        aviso.textContent = 'Falha ao autenticar no Supabase. Ative Anonymous Auth em Authentication > Providers e confira as configurações.';
        messagesDiv.appendChild(aviso);
        console.error('[DEBUG] Erro de autenticação Supabase:', authError);
      }
    }

    window.addEventListener('beforeunload', function () {
      stopPrivateTitleFlash();
      stopTypingBroadcast();
      if (messagePollingInterval) {
        clearInterval(messagePollingInterval);
        messagePollingInterval = null;
      }
      if (presenceChannel) presenceChannel.unsubscribe();
      if (messagesChannel) messagesChannel.unsubscribe();
      if (broadcastChannel) broadcastChannel.unsubscribe();
      if (privateInboxChannel) privateInboxChannel.unsubscribe();
      if (authSubscription) {
        authSubscription.unsubscribe();
        authSubscription = null;
      }
      privateOutChannels.forEach(function (channel) {
        channel.unsubscribe();
      });
    });

    loadProfilePreference();

    if (!isSupabaseConfigured()) {
      setInputsDisabled(true);
      onlineCountElem.textContent = '0';
      onlineTextElem.textContent = 'configure o Supabase';
      setConnectionStatus('Configuração ausente', true);
      updateLiveHeaderLabel(0);
      const aviso = document.createElement('div');
      aviso.className = 'message';
      aviso.textContent = 'Configure as credenciais do Supabase em firebase-config.js para ativar o chat em tempo real.';
      messagesDiv.appendChild(aviso);
    } else {
      setConnectionStatus('Conectando...', false);
      initRealtime();
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', toggleTheme);
    }
    loadThemePreference();
    updateAvatarInputState();
    autoResizeMessageInput();
    updateMessageCounter();

  </script>
</body>
</html>
